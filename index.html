 klein stellen und 4–5 Minuten unter gelegentlichem Rühren köcheln, bis ein cremiger Brei entsteht.","[[Äpfel]] waschen, entkernen und klein würfeln (Schale kann dranbleiben).","Die Hälfte der Apfelwürfel und den [[Zimt]] unter das Porridge rühren und 1 Minute mitziehen lassen.","In Schalen füllen, restliche Apfelwürfel darauf verteilen.","Mit [[Honig]] beträufeln und warm servieren."]},"Joghurt-Müsli mit Banane":{"q":"yogurt muesli banana","a":{"Naturjoghurt":"300 g","Müsli":"80 g","Bananen":"1 Stück","Honig":"2 TL"},"s":["[[Naturjoghurt]] glatt rühren und auf 2 Schalen verteilen.","[[Bananen]] schälen und in Scheiben schneiden.","[[Müsli]] auf den Joghurt streuen und die Bananenscheiben darauf legen.","Mit [[Honig]] beträufeln und sofort essen, damit das Müsli knusprig bleibt."]},"Avocado-Toast mit Ei":{"q":"avocado toast egg","a":{"Vollkornbrot":"2 Scheiben","Avocado":"1 Stück","Eier":"2 Stück","Zitrone":"½ Stück","Chiliflocken":"1 Prise"},"s":["Wasser in einem kleinen Topf zum Kochen bringen. [[Eier]] mit einem Löffel hineinlegen und genau 7 Minuten kochen (wachsweich).","Eier sofort kalt abschrecken und pellen.","[[Avocado]] halbieren, entkernen, das Fruchtfleisch herauslöffeln und mit einer Gabel zerdrücken. Mit dem Saft der [[Zitrone]], Salz und Pfeffer würzen.","[[Vollkornbrot]] im Toaster oder in der Pfanne knusprig rösten.","Avocadocreme dick auf das Brot streichen.","Eier halbieren, auflegen und mit [[Chiliflocken]] und etwas Salz bestreuen."]},"Pfannkuchen mit Apfelmus":{"q":"Pfannkuchen Apfelmus","a":{"Mehl":"150 g","Eier":"2 Stück","Milch":"250 ml","Butter":"2 EL","Apfelmus":"200 g"},"s":["[[Mehl]], [[Eier]], [[Milch]] und eine Prise Salz mit dem Schneebesen zu einem glatten, flüssigen Teig verrühren.","Teig 10 Minuten ruhen lassen.","Eine beschichtete Pfanne (24–28 cm) bei mittlerer Hitze erhitzen und ½ TL [[Butter]] darin schmelzen.","Eine kleine Kelle Teig hineingeben und die Pfanne schwenken, bis der Boden dünn bedeckt ist.","1–2 Minuten backen, bis die Unterseite goldbraun ist, wenden und noch 1 Minute backen. So weiter verfahren (ergibt 5–6 Pfannkuchen).","Mit [[Apfelmus]] servieren, nach Wunsch mit Zimt und Zucker."]},"Bananen-Hafer-Pancakes":{"q":"banana oat pancakes","a":{"Haferflocken":"100 g","Bananen":"2 Stück","Eier":"2 Stück","Milch":"100 ml","Beeren":"150 g"},"s":["[[Beeren]] auftauen lassen (oder in einem kleinen Topf 3 Minuten erwärmen).","[[Bananen]] in einer Schüssel mit der Gabel zu Mus zerdrücken.","[[Eier]], [[Haferflocken]], [[Milch]], ½ TL Backpulver (falls vorhanden) und eine Prise Salz unterrühren. 5 Minuten quellen lassen.","Eine beschichtete Pfanne bei mittlerer Hitze mit wenig Öl auspinseln.","Pro Pancake 2 EL Teig hineingeben und 2 Minuten backen, bis sich Bläschen bilden. Wenden und noch 1–2 Minuten backen.","Mit den Beeren servieren."]},"Beeren-Smoothie-Bowl":{"q":"smoothie bowl berries","a":{"Beeren":"250 g","Bananen":"2 Stück","Naturjoghurt":"150 g","Haferflocken":"30 g"},"s":["1 [[Bananen]] schälen und in Stücke brechen.","Gefrorene [[Beeren]], Bananenstücke und [[Naturjoghurt]] im Mixer 30–60 Sekunden zu einer dicken, cremigen Masse mixen. Ist sie zu fest, 2–3 EL Milch zugeben.","Smoothie in 2 Schalen füllen.","Die zweite Banane in Scheiben schneiden.","Bananenscheiben und [[Haferflocken]] darauf verteilen und sofort essen."]},"Frischkäse-Brötchen mit Gurke":{"q":"bread roll cream cheese cucumber","a":{"Brötchen":"4 Stück","Frischkäse":"100 g","Gurke":"½ Stück","Tomaten":"2 Stück","Schnittlauch":"½ Bund"},"s":["[[Brötchen]] (bei Aufbackbrötchen nach Packungsanweisung backen) quer aufschneiden.","[[Schnittlauch]] in feine Röllchen schneiden und unter den [[Frischkäse]] rühren. Mit Salz und Pfeffer würzen.","Brötchenhälften dick mit dem Frischkäse bestreichen.","[[Gurke]] und [[Tomaten]] in dünne Scheiben schneiden und auflegen.","Mit etwas Salz und Pfeffer bestreuen."]},"Spiegelei mit Speck und Toast":{"q":"fried egg bacon toast","a":{"Eier":"4 Stück","Speckwürfel":"100 g","Toastbrot":"4 Scheiben","Tomaten":"2 Stück"},"s":["[[Speckwürfel]] in eine kalte Pfanne geben und bei mittlerer Hitze 4–5 Minuten auslassen, bis sie knusprig sind.","Speck an den Rand schieben. [[Eier]] einzeln in die Pfanne schlagen.","Bei mittlerer bis kleiner Hitze 3–4 Minuten braten, bis das Eiweiß fest und das Eigelb noch flüssig ist. Mit Salz und Pfeffer würzen.","Währenddessen [[Toastbrot]] toasten.","[[Tomaten]] in Scheiben schneiden und leicht salzen.","Spiegeleier mit Speck, Toast und Tomaten anrichten."]},"Quark mit Früchten":{"q":"quark berries","a":{"Magerquark":"250 g","Milch":"4 EL","Beeren":"150 g","Bananen":"1 Stück","Honig":"2 TL"},"s":["[[Beeren]] auftauen lassen (am besten am Vorabend in den Kühlschrank stellen).","[[Magerquark]] mit [[Milch]] glatt und cremig rühren.","Mit [[Honig]] süßen und auf 2 Schalen verteilen.","[[Bananen]] in Scheiben schneiden.","Beeren und Banane auf den Quark geben und servieren."]},"Schinken-Käse-Toast":{"q":"ham cheese toast","a":{"Toastbrot":"4 Scheiben","Kochschinken":"4 Scheiben","Käsescheiben":"4 Scheiben","Butter":"1 EL"},"s":["[[Toastbrot]] dünn mit [[Butter]] bestreichen.","2 Scheiben mit der Butterseite nach unten legen und mit je 1 Scheibe Käse, 2 Scheiben [[Kochschinken]] und wieder 1 Scheibe Käse belegen. Mit den übrigen Toasts (Butterseite nach außen) zuklappen.","Pfanne: bei mittlerer Hitze ohne Fett pro Seite 3 Minuten goldbraun braten, dabei leicht andrücken.","Oder Ofen: bei 200 °C (180 °C Umluft) 8–10 Minuten auf einem Blech backen, nach der Hälfte wenden.","Oder Heißluftfritteuse: bei 180 °C 6–7 Minuten garen, nach der Hälfte wenden.","Diagonal halbieren und warm servieren."]},"Omelett-Wrap mit Spinat":{"q":"omelette wrap","a":{"Wraps":"2 Stück","Eier":"4 Stück","Spinat":"100 g","Feta":"60 g"},"s":["Aufgetauten [[Spinat]] gut ausdrücken.","[[Eier]] mit Salz und Pfeffer verquirlen.","1 TL Öl in einer Pfanne (Größe wie die Wraps) bei mittlerer Hitze erhitzen und die Hälfte vom Spinat 1 Minute erwärmen.","Die Hälfte der Eier darübergießen, ein Drittel vom [[Feta]] darüberbröseln und 2 Minuten stocken lassen.","Einen [[Wraps]] auf das noch leicht feuchte Omelett legen, andrücken, nach 30 Sekunden alles zusammen wenden und 1 Minute braten.","Einrollen und halbieren. Mit der zweiten Portion genauso verfahren."]},"Chia-Pudding mit Mango":{"q":"chia pudding mango","a":{"Chiasamen":"50 g","Kokosmilch":"300 ml","Mango":"1 Stück","Honig":"2 TL"},"s":["[[Kokosmilch]] gut verrühren und mit [[Chiasamen]] und [[Honig]] in einer Schüssel mischen.","10 Minuten stehen lassen und dann nochmals gründlich umrühren, damit keine Klümpchen entstehen.","Abgedeckt mindestens 3 Stunden, am besten über Nacht, in den Kühlschrank stellen.","[[Mango]] schälen, das Fruchtfleisch vom Kern schneiden und würfeln.","Pudding auf 2 Gläser verteilen und mit Mango toppen."]},"Arme Ritter mit Beeren":{"q":"french toast berries","a":{"Toastbrot":"4 Scheiben","Eier":"2 Stück","Milch":"150 ml","Zimt":"½ TL","Beeren":"150 g","Öl":"1 EL"},"s":["[[Beeren]] auftauen lassen oder 3 Minuten in einem kleinen Topf erwärmen.","[[Eier]], [[Milch]], [[Zimt]], 1 TL Zucker und eine Prise Salz in einem tiefen Teller verquirlen.","[[Toastbrot]] pro Seite 10 Sekunden in der Eiermilch einweichen.","[[Öl]] (oder Butter) in einer Pfanne bei mittlerer Hitze erhitzen.","Brotscheiben pro Seite 2–3 Minuten goldbraun braten.","Mit den Beeren servieren, nach Wunsch mit etwas Puderzucker."]},"Räucherlachs-Brot mit Frischkäse":{"q":"smoked salmon bread","a":{"Vollkornbrot":"4 Scheiben","Räucherlachs":"100 g","Frischkäse":"100 g","Gurke":"¼ Stück","Zitrone":"½ Stück"},"s":["[[Vollkornbrot]] nach Wunsch kurz toasten.","[[Frischkäse]] mit etwas abgeriebener Schale der [[Zitrone]], Salz und Pfeffer verrühren.","Brot mit dem Frischkäse bestreichen.","[[Gurke]] in hauchdünne Scheiben schneiden und auflegen.","[[Räucherlachs]] darauf verteilen.","Mit ein paar Tropfen Zitronensaft und Pfeffer abschmecken."]},"Reis-Frühstücksbowl mit Ei":{"q":"rice bowl fried egg","a":{"Reis":"120 g","Eier":"2 Stück","Frühlingszwiebeln":"2 Stück","Sojasoße":"2 EL","Gurke":"½ Stück"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen. Reis vom Vortag kurz in der Mikrowelle oder Pfanne erwärmen.","[[Frühlingszwiebeln]] in feine Ringe, [[Gurke]] in dünne Scheiben schneiden.","1 TL Öl in einer Pfanne bei mittlerer Hitze erhitzen und [[Eier]] als Spiegeleier 3 Minuten braten, bis das Eiweiß am Rand knusprig ist.","Reis auf 2 Schalen verteilen.","Je ein Spiegelei daraufsetzen und Gurke daneben legen.","Mit [[Sojasoße]] beträufeln und mit Frühlingszwiebeln bestreuen."]},"Mediterranes Frühstücksbrot":{"q":"bread tomato feta olives","a":{"Vollkornbrot":"4 Scheiben","Tomaten":"2 Stück","Feta":"80 g","Oliven":"40 g","Olivenöl":"1 EL"},"s":["[[Vollkornbrot]] im Toaster oder in der Pfanne kurz rösten.","Brot mit [[Olivenöl]] beträufeln.","[[Tomaten]] in Scheiben schneiden, auflegen und leicht salzen.","[[Feta]] darüberbröseln, [[Oliven]] halbieren und verteilen.","Mit Pfeffer und etwas Oregano bestreuen."]},"Hähnchen-Salat mit Joghurtdressing":{"q":"chicken salad","a":{"Hähnchenbrust":"250 g","Salat":"1 Kopf","Gurke":"½ Stück","Cherrytomaten":"150 g","Naturjoghurt":"150 g","Zitrone":"½ Stück"},"s":["[[Hähnchenbrust]] trocken tupfen und mit Salz, Pfeffer und ½ TL Paprikapulver würzen.","1 EL Öl in einer Pfanne bei mittlerer bis hoher Hitze erhitzen und das Hähnchen pro Seite 5–6 Minuten braten, bis es durchgegart ist. 3 Minuten ruhen lassen.","[[Salat]] waschen und zupfen, [[Gurke]] in Scheiben schneiden, [[Cherrytomaten]] halbieren.","[[Naturjoghurt]] mit dem Saft der [[Zitrone]], 1 EL Olivenöl, Salz, Pfeffer und etwas Senf verrühren.","Salat und Gemüse auf Teller verteilen.","Hähnchen in Streifen schneiden, darauflegen und mit dem Dressing beträufeln."]},"Caprese mit Baguette":{"q":"caprese salad","a":{"Tomaten":"3 Stück","Mozzarella":"250 g","Basilikum":"½ Bund"," const AMOUNT_BASE=2;
const UNIT_PL={Dose:'Dosen',Zehe:'Zehen',Stange:'Stangen',Rolle:'Rollen',Scheibe:'Scheiben',Zweig:'Zweige',Glas:'Gläser',Kopf:'Köpfe',Packung:'Packungen',Blatt:'Blätter'};
const UNIT_SG=Object.fromEntries(Object.entries(UNIT_PL).map(([a,b])=>[b,a]));
const ING_SG={'Zwiebeln':'Zwiebel','Rote Zwiebeln':'rote Zwiebel','Frühlingszwiebeln':'Frühlingszwiebel','Karotten':'Karotte','Eier':'Ei','Tomaten':'Tomate','Kartoffeln':'Kartoffel','Süßkartoffeln':'Süßkartoffel','Bananen':'Banane','Äpfel':'Apfel','Wraps':'Wrap'};

function fmtNum(n){const w=Math.floor(n+1e-9),f=Math.round((n-w)*100)/100;const fr=f===.5?'½':f===.25?'¼':f===.75?'¾':'';if(fr)return (w||'')+fr;return String(Math.round(n*10)/10).replace('.',',')}
function parseAmount(t){const m=String(t||'').match(/^(\d+(?:[.,]\d+)?|½|¼|¾)\s*(.*)$/);if(!m)return null;const n={'½':.5,'¼':.25,'¾':.75}[m[1]]??parseFloat(m[1].replace(',','.'));return {n,unit:m[2].trim()}}
function scaledAmount(r,ing){const raw=r.amounts?.[ing];const p=parseAmount(raw);if(!p)return {text:raw||'',n:null,unit:''};let {n,unit}=p;if(unit==='Prise')return {text:raw,n,unit};let v=n*state.persons/AMOUNT_BASE;
 if(unit==='g'||unit==='ml'){v=v>=100?Math.round(v/10)*10:Math.max(5,Math.round(v/5)*5);if(v>=1000){v=Math.round(v/100)/10;unit=unit==='g'?'kg':'l'}}
 else if(unit==='kg'||unit==='l'){v=Math.round(v*10)/10}
 else if(unit==='EL'||unit==='TL'){v=Math.max(.5,Math.round(v*2)/2)}
 else{v=v>=2?Math.round(v*2)/2:Math.max(.25,Math.round(v*4)/4)}
 if(v>1&&UNIT_PL[unit])unit=UNIT_PL[unit];if(v<=1&&UNIT_SG[unit])unit=UNIT_SG[unit];return {text:fmtNum(v)+(unit?' '+unit:''),n:v,unit}}
function listAmount(r,ing){const a=scaledAmount(r,ing);return a.text||ITEMS[ing]?.[0]||''}
function ingPhrase(r,ing){const a=scaledAmount(r,ing);if(!a.text||a.text==='nach Geschmack')return escapeHtml(ing);if(a.unit==='Stück'){const name=a.n<=1?(ING_SG[ing]||ing):(ING_PL[ing]||ing);return `<b>${escapeHtml(fmtNum(a.n))}</b> ${escapeHtml(name)}`}return `<b>${escapeHtml(a.text)}</b> ${escapeHtml(ing)}`}
function stepHtml(r,t){return escapeHtml(t).replace(/\[\[(.+?)\]\]/g,(_,ing)=>ingPhrase(r,ing.replace(/&amp;/g,'&')))}
function personsLabel(){const n=state.persons;return n===1?'1 Person':n+' Personen'}

ength<7?`<div class="reco">An den anderen Tagen kannst du Reste essen oder auswärts essen.</div>`:''}<p class="notice">* Preise ohne Quellenangabe sind Schätzwerte. Über die Einkaufsliste kannst du gemeldete Onlinepreise suchen und speichern. Keine garantierten Filialpreise.</p>`;shell(x+bottomNav(),'mainpage')}

function toggleFavorite(id){toggle('favorites',id);currentRecipe=id;state.tab='Rezept';render()};function swapRecipe(day,meal='Abend'){let current=state.plan.find(x=>x.day===day&&mealOf(x)===meal);if(!current)return toast('Dieser Eintrag ist nicht mehr im Wochenplan');let alt=validRecipes().filter(r=>r.meal===meal&&r.id!==current.id&&!state.plan.some(p=>p.id===r.id));const fit=alt.filter(deviceOK);if(fit.length)alt=fit;const target=mealBudget(meal);alt.sort((a,b)=>(state.prefs.includes(b.tag)?1:0)-(state.prefs.includes(a.tag)?1:0)||Math.abs(cost(a)-target)-Math.abs(cost(b)-target));if(!alt.length)return toast('Kein anderes passendes Rezept verfügbar');current.id=alt[0].id;state.checked=[];save();openRecipe(current.id,day,meal);toast('Rezept wurde getauscht')};
function assignRecipe(id){const r=RECIPES.find(x=>x.id===id);if(!r)return;const meal=r.meal||'Abend';let day=state.days.find(d=>!state.plan.some(p=>p.day===d&&mealOf(p)===meal));if(day==null)day=state.days[0]??0;let found=state.plan.find(p=>p.day===day&&mealOf(p)===meal);if(found)found.id=id;else state.plan.push({day,id,meal});sortPlan();state.checked=[];save();changeTab('Plan');toast(MEAL_INFO[meal].label+' am '+FULLDAYS[day]+' eingeplant')}

function addExtra(){
 let name=$('extra-name')?.value.trim().replace(/[\x00-\x1f]/g,' ').slice(0,85)||'';
 let qty=$('extra-qty')?.value.trim().replace(/[\x00-\x1f]/g,' ').slice(0,40)||'1 Stück';
 let num=($('extra-price')?.value||'0').replace(',','.');let price=Number(num);

 if(!name)return toast('Gib zuerst ein Lebensmittel ein.');

 if(!Number.isFinite(price)||price<0||price>1000)return toast('Ungültiger Preis.');
 const id=(globalThis.crypto?.randomUUID?.()||('i'+Date.now()+'_'+Math.floor(Math.random()*999999))).replace(/[^a-zA-Z0-9_-]/g,'');
 state.extras.push({id,name,qty,price,category});save();shopping();toast(name+' hinzugefügt ✓');

// Onlinepreis-Integration: Open Prices ist eine öffentliche Belegdatenbank (keine Live-Preisliste der Händler).
// Preise werden nur nach ausdrücklicher Auswahl des Nutzers in die private Einkaufsliste übernommen.
function parseQuantity(value){
 const s=String(value||'').toLowerCase().replace(/,/g,'.').replace(/stück|stk\.?/g,'st').trim();
 const match=s.match(/^(?:(\d+(?:\.\d+)?)\s*[x×]\s*)?(\d+(?:\.\d+)?)\s*(kg|g|ml|l|st|dose[n]?|packung[en]?)\b/i);
 if(!match)return null;
 let num=Number(match[1]||1)*Number(match[2]),unit=match[3];
 if(unit==='kg'){num*=1000;unit='g'}if(unit==='l'){num*=1000;unit='ml'}
 if(unit.startsWith('dose'))unit='dose';if(unit.startsWith('pack'))unit='packung';
 return {n:num,unit};
}
function packageCount(item){
 const p=state.priceOverrides?.[item.ing];if(!p)return null;
 const required=parseQuantity(item.qty),available=parseQuantity(p.qty);
 if(required&&available&&required.unit===available.unit&&available.n>0){return Math.max(1,Math.ceil(required.n*item.times*state.persons/3/available.n))}
 return Math.max(1,Math.ceil(item.times*state.persons/3));
}
function itemCost(item){if(item.custom)return Number(item.price)||0;const p=state.priceOverrides?.[item.ing];return p&&Number.isFinite(+p.amount)&&+p.amount>0?Number(p.amount)*packageCount(item):item.price*item.times*state.persons/3}

const observedPrices={};
async function lookupPrice(ing){
 const title=priceTitle(ing);openPriceDialog(title+'<div class="price-spinner">⏳ Suche gemeldete Preise online …</div>');
 const body=$('price-dialog-body');
 // Nutzergetriggerte Abfrage, kein automatisches Crawling oder unbelegter Echtzeitpreis.
 try{
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),14000);
  let response;
  try{response=await fetch('https://prices.openfoodfacts.org/api/v1/prices?'+new URLSearchParams({product_name:ing,currency:'EUR',order_by:'-date',size:'65'}),{signal:controller.signal,headers:{Accept:'application/json'}})}finally{clearTimeout(timer)}
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();if(!Array.isArray(data.items))throw new Error('Ungültige Antwort');
  let list=data.items.filter(p=>p&&Number(p.price)>0&&p.currency==='EUR');
  const info=p=>(p.location?.osm_display_name||p.location?.name||p.location?.address||'')+' '+(p.location?.osm_address_country_code||'');
  const german=p=>/\bDeutschland\b|\bGermany\b|\bDE\b/i.test(info(p));
  const chosen=String(state.store||'').replace(/edeka/i,'Edeka').toLowerCase();
  list.sort((a,b)=>(german(b)?3:0)-(german(a)?3:0)+ (info(b).toLowerCase().includes(chosen)?2:0)-(info(a).toLowerCase().includes(chosen)?2:0) || String(b.date).localeCompare(String(a.date)) );
  observedPrices[ing]=list.slice(0,18);
  body.innerHTML=title+'<div class="price-info">📅 Das sind <b>historische, gemeldete Preise</b>, keine Live-Angebote. Händler und Datum prüfen; der Preis wird erst nach deiner Auswahl übernommen.</div>'+(observedPrices[ing].length?observedPrices[ing].map((p,k)=>{
   const name=p.product?.product_name||p.product_name||ing;
   const location=p.location?.osm_display_name||p.location?.name||'Markt nicht angegeben';
   const quantity=p.product?.quantity|| (p.price_per==='KILOGRAM'?'1 kg':p.price_per==='LITER'?'1 l':'Packungsgröße unbekannt');
   const badge=german(p)?'🇩🇪':'🌍';
   return '<div class="price-card"><b>'+money(p.price)+'</b> · '+escapeHtml(String(quantity))+'<div class="subline">'+escapeHtml(name)+'<br>'+badge+' '+escapeHtml(location)+'<br>📅 '+escapeHtml(p.date||'Datum unbekannt')+'</div><button onclick="useObservedPrice(decodeURIComponent(\''+encodeURIComponent(ing)+'\'),'+k+')">Preis übernehmen</button></div>'
  }).join(''):'<p class="price-hint">Für diesen Suchbegriff wurden keine Preismeldungen gefunden. Die App zeigt weiterhin den Schätzpreis an.</p>')+manualPriceForm(ing)+offerLinks();
 }catch(e){if(!document.getElementById('price-dialog-body'))return;body.innerHTML=title+'<div class="price-info">⚠️ Preisabfrage nicht erreichbar oder keine Verbindung. Grund: '+escapeHtml(e.name==='AbortError'?'Zeitüberschreitung':e.message)+'. Der Schätzpreis bleibt unverändert.</div>'+manualPriceForm(ing)+offerLinks()}
}
function manualPriceForm(ing){let p=state.priceOverrides?.[ing];return '<div class="section"><h3>✏ Eigenen Preis eintragen</h3><p class="price-hint">Gesamtpreis für eine Packung, unabhängig von der Schätzpreis-Angabe.</p><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input class="price-input" type="number" min="0.01" max="1000" step="0.01" id="manual-price" placeholder="Preis in €" value="'+(p?.amount||'')+'"><input class="price-input" id="manual-quantity" placeholder="z.B. 500 g" value="'+escapeHtml(p?.qty||ITEMS[ing]?.[0]||'')+'"><button class="secondary" onclick="saveManualPrice(decodeURIComponent(\''+encodeURIComponent(ing)+'\'))">Speichern</button></div>'+(p?'<p><button class="secondary" onclick="deletePrice(decodeURIComponent(\''+encodeURIComponent(ing)+'\'))">Gespeicherten Preis löschen</button></p>':'')+'</div>'}
function saveManualPrice(ing){let price=Number(($('manual-price')?.value||'').replace(',','.'));if(!(price>0&&price<=1000))return toast('Bitte gültigen Preis eingeben.');let qty=$('manual-quantity').value.trim()||ITEMS[ing]?.[0]||'Packung';state.priceOverrides[ing]={amount:price,qty,date:new Date().toISOString().slice(0,10),store:'Selbst eingetragen',source:'Eigene Angabe'};save();closePriceDialog();shopping();toast('Preis gespeichert')}
function useObservedPrice(ing,k){let p=observedPrices[ing]?.[k];if(!p)return;let store=p.location?.osm_display_name||p.location?.name||'Open Prices';let qty=p.product?.quantity|| (p.price_per==='KILOGRAM'?'1 kg':p.price_per==='LITER'?'1 l':ITEMS[ing]?.[0]||'Packung');state.priceOverrides[ing]={amount:Number(p.price),qty,date:p.date||'',store:String(store).slice(0,90),source:'Open Prices',product:p.product?.product_name||p.product_name||ing,code:p.product_code||''};save();closePriceDialog();shopping();toast('Onlinepreismeldung übernommen')}

 var startY=null,startX=0,pull=0,ind=null,LIMIT=110;
