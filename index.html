 Mit Salz, Pfeffer und ½ TL Paprikapulver würzen.","[[Naturjoghurt]] mit Salz und etwas Knoblauchpulver verrühren. [[Salat]] waschen und in Streifen schneiden.","[[Wraps]] in einer trockenen Pfanne pro Seite 20 Sekunden erwärmen, damit sie geschmeidig werden.","Wraps mit Joghurt bestreichen, Salat und Gemüsefüllung in die Mitte geben.","Unten einschlagen, seitlich fest einrollen und halbieren."]},"Ofenkartoffeln mit Quark":{"q":"baked potato sour cream","a":{"Kartoffeln":"4 Stück","Frischkäse":"75 g","Naturjoghurt":"150 g","Gurke":"½ Stück","Gewürze":"nach Geschmack"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Kartoffeln]] (mittelgroß, mehligkochend) gründlich waschen, mit einer Gabel mehrmals einstechen und mit etwas Öl und Salz einreiben.","Auf einem Blech 45–50 Minuten backen, bis sie sich leicht mit einem Messer einstechen lassen.","[[Frischkäse]] und [[Naturjoghurt]] glatt rühren. [[Gurke]] fein würfeln und unterheben.","Mit Salz, Pfeffer und 1 EL Schnittlauch oder Kräutern würzen.","Kartoffeln längs einschneiden, leicht aufdrücken und den Quark hineingeben."]},"Asia-Nudelpfanne":{"q":"stir fried noodles vegetables","a":{"Nudeln":"200 g","Karotten":"2 Stück","Paprika":"1 Stück","Brokkoli":"½ Kopf","Sojasoße":"3 EL","Öl":"2 EL"},"s":["[[Nudeln]] nach Packungsanweisung bissfest kochen, abgießen und kalt abschrecken.","[[Karotten]] in dünne Stifte, [[Paprika]] in Streifen schneiden, [[Brokkoli]] in kleine Röschen teilen.","[[Öl]] in einer großen Pfanne oder einem Wok bei hoher Hitze erhitzen.","Brokkoli und Karotten 3 Minuten unter Rühren braten, Paprika zugeben und 2 Minuten weiterbraten. Das Gemüse soll noch Biss haben.","Nudeln zugeben und 2 Minuten mitbraten.","Mit [[Sojasoße]] ablöschen, gut durchschwenken und sofort servieren."]},"Chili sin Carne":{"q":"vegetarian chili beans","a":{"Kidneybohnen":"1 Dose","Mais":"1 Dose","Passierte Tomaten":"400 g","Paprika":"1 Stück","Zwiebeln":"1 Stück","Reis":"150 g","Gewürze":"nach Geschmack"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Zwiebeln]] fein würfeln, [[Paprika]] in kleine Würfel schneiden.","Zwiebeln in 1 EL Öl bei mittlerer Hitze 3 Minuten dünsten, Paprika zugeben und 3 Minuten mitbraten.","1 TL Kreuzkümmel, 1 TL Paprikapulver und ½ TL Chilipulver zugeben und 30 Sekunden anrösten.","[[Passierte Tomaten]], abgespülte [[Kidneybohnen]] und [[Mais]] zugeben. 15 Minuten offen köcheln lassen.","Mit Salz, Pfeffer und einer Prise Zucker abschmecken und mit dem Reis servieren."]},"Brokkoli-Käse-Nudeln":{"q":"broccoli cheese pasta","a":{"Nudeln":"250 g","Brokkoli":"1 Kopf","Reibekäse":"100 g","Milch":"200 ml","Gewürze":"nach Geschmack"},"s":["Reichlich Salzwasser aufkochen. [[Brokkoli]] in kleine Röschen teilen.","[[Nudeln]] ins Wasser geben. 4 Minuten vor Ende der Garzeit den Brokkoli dazugeben.","Alles abgießen, dabei eine Tasse Nudelwasser auffangen.","[[Milch]] im leeren Topf bei mittlerer Hitze erwärmen (nicht kochen). [[Reibekäse]] einrühren, bis er geschmolzen ist.","Nudeln und Brokkoli unterheben. Ist die Soße zu dick, etwas Nudelwasser zugeben.","Mit Salz, Pfeffer und einer Prise Muskat abschmecken."]},"Gefüllte Süßkartoffeln":{"q":"stuffed sweet potato","a":{"Süßkartoffeln":"2 Stück","Kichererbsen":"1 Dose","Tomaten":"2 Stück","Naturjoghurt":"150 g","Limette":"1 Stück"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Süßkartoffeln]] waschen, mehrmals einstechen und auf einem Blech 40–45 Minuten weich backen.","[[Kichererbsen]] abspülen, trocken tupfen, mit 1 EL Öl, ½ TL Paprikapulver und Salz mischen und die letzten 20 Minuten mit aufs Blech geben.","[[Tomaten]] fein würfeln und mit Salz und etwas Saft der [[Limette]] mischen.","[[Naturjoghurt]] mit Salz und dem restlichen Limettensaft verrühren.","Süßkartoffeln längs aufschneiden, das Innere leicht aufdrücken und mit Kichererbsen, Tomaten und Joghurt füllen."]},"Tomaten-Mozzarella-Pasta":{"q":"pasta tomato mozzarella","a":{"Nudeln":"250 g","Tomaten":"4 Stück","Mozzarella":"125 g","Knoblauch":"2 Zehen","Öl":"2 EL"},"s":["[[Nudeln]] in reichlich Salzwasser nach Packungsanweisung bissfest kochen.","[[Tomaten]] in kleine Würfel schneiden, [[Knoblauch]] fein hacken, [[Mozzarella]] in Würfel schneiden.","[[Öl]] in einer Pfanne bei mittlerer Hitze erhitzen und den Knoblauch 1 Minute anschwitzen, ohne dass er braun wird.","Tomaten zugeben und 3 Minuten schmoren. Mit Salz, Pfeffer und 1 TL Oregano würzen.","Nudeln abgießen und in der Pfanne mit den Tomaten schwenken.","Pfanne vom Herd nehmen, Mozzarella unterheben und sofort servieren, solange er leicht schmilzt."]},"Spinat-Feta-Pfanne":{"q":"spinach potatoes feta","a":{"Spinat":"300 g","Feta":"100 g","Kartoffeln":"600 g","Zwiebeln":"1 Stück","Öl":"2 EL"},"s":["[[Kartoffeln]] schälen, in 1 cm große Würfel schneiden und in Salzwasser 8 Minuten vorkochen. Gut abtropfen lassen.","Tiefgekühlten [[Spinat]] auftauen lassen und gut ausdrücken. [[Zwiebeln]] fein würfeln.","[[Öl]] in einer großen Pfanne bei mittlerer bis hoher Hitze erhitzen und die Kartoffeln 8–10 Minuten goldbraun braten.","Zwiebeln zugeben und 2 Minuten mitbraten.","Spinat unterrühren und 3 Minuten erhitzen. Mit Salz, Pfeffer und einer Prise Muskat würzen.","[[Feta]] darüberbröseln und kurz anwärmen lassen."]},"Tortellini-Pfanne":{"q":"tortellini tomato sauce","a":{"Tortellini":"400 g","Passierte Tomaten":"400 g","Frischkäse":"75 g","Spinat":"150 g"},"s":["[[Passierte Tomaten]] in einer großen Pfanne bei mittlerer Hitze aufkochen. Mit Salz, Pfeffer und 1 TL Italienischen Kräutern würzen.","[[Frischkäse]] einrühren, bis eine glatte, rosa Soße entsteht.","Aufgetauten, gut ausgedrückten [[Spinat]] zugeben und 2 Minuten mitköcheln.","[[Tortellini]] direkt in die Soße geben und 100 ml Wasser zugießen.","Zugedeckt bei mittlerer Hitze 4–5 Minuten garen, dabei einmal umrühren.","Abschmecken und servieren."]},"Bunte Gemüsesuppe":{"q":"vegetable soup","a":{"Kartoffeln":"300 g","Karotten":"2 Stück","Zucchini":"1 Stück","Erbsen":"150 g","Gemüsebrühe":"800 ml","Zwiebeln":"1 Stück"},"s":["[[Zwiebeln]] fein würfeln, [[Kartoffeln]] und [[Karotten]] schälen und in 1 cm große Würfel schneiden.","1 EL Öl in einem Topf bei mittlerer Hitze erhitzen und die Zwiebeln 2 Minuten andünsten.","Kartoffeln und Karotten zugeben, 2 Minuten mitdünsten und mit [[Gemüsebrühe]] ablöschen.","Aufkochen und zugedeckt 12 Minuten köcheln lassen.","[[Zucchini]] würfeln und mit den [[Erbsen]] zugeben. Weitere 6 Minuten köcheln lassen.","Mit Salz, Pfeffer und gehackter Petersilie abschmecken."]},"Hähnchen-Reis-Bowl":{"q":"chicken rice bowl","a":{"Reis":"150 g","Hähnchenbrust":"300 g","Gurke":"½ Stück","Karotten":"2 Stück","Naturjoghurt":"150 g"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Hähnchenbrust]] in 2 cm große Würfel schneiden und mit Salz, Pfeffer und 1 TL Paprikapulver würzen.","1 EL Öl in einer Pfanne bei mittlerer bis hoher Hitze erhitzen und das Hähnchen 6–7 Minuten rundum braten, bis es durchgegart ist.","[[Gurke]] in Scheiben schneiden, [[Karotten]] schälen und grob raspeln.","[[Naturjoghurt]] mit Salz, Pfeffer und etwas Zitronensaft verrühren.","Reis in Schalen geben, Hähnchen, Gurke und Karotten darauf anrichten und mit der Joghurtsoße beträufeln."]},"Kichererbsen-Pfanne":{"q":"chickpea spinach curry","a":{"Kichererbsen":"1 Dose","Passierte Tomaten":"400 g","Spinat":"200 g","Zwiebeln":"1 Stück","Reis":"150 g"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Zwiebeln]] fein würfeln und in 1 EL Öl bei mittlerer Hitze 3 Minuten dünsten.","1 TL Kreuzkümmel und 1 TL Currypulver zugeben und 30 Sekunden anrösten.","[[Passierte Tomaten]] und abgespülte [[Kichererbsen]] zugeben und 8 Minuten köcheln lassen.","Aufgetauten, ausgedrückten [[Spinat]] unterrühren und 3 Minuten mitköcheln.","Mit Salz und Pfeffer abschmecken und mit dem Reis servieren."]},"Vegetarische Ofen-Pasta":{"q":"baked pasta mozzarella","a":{"Nudeln":"250 g","Passierte Tomaten":"400 g","Mozzarella":"125 g","Zucchini":"1 Stück","Zwiebeln":"1 Stück"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Nudeln]] in Salzwasser 2 Minuten kürzer als auf der Packung angegeben kochen und abgießen.","[[Zwiebeln]] würfeln, [[Zucchini]] in kleine Würfel schneiden. Beides in 1 EL Öl bei mittlerer Hitze 5 Minuten braten.","[[Passierte Tomaten]] zugeben, mit Salz, Pfeffer und 1 TL Oregano würzen und 3 Minuten köcheln lassen.","Nudeln mit der Soße mischen und in eine Auflaufform füllen. [[Mozzarella]] in Scheiben darauf verteilen.","Im Ofen 15–20 Minuten backen, bis der Käse goldbraun ist."]},"Couscous-Gemüse-Bowl":{"q":"couscous chickpeas salad","a":{"Couscous":"150 g","Gurke":"½ Stück","Tomaten":"2 Stück","Kichererbsen":"1 Dose","Zitrone":"1 Stück"},"s":["[[Couscous]] mit der gleichen Menge kochendem Salzwasser übergießen und abgedeckt 5 Minuten quellen lassen.","Couscous mit einer Gabel auflockern.","[[Gurke]] und [[Tomaten]] würfeln, [[Kichererbsen]] abspülen und abtropfen lassen.","Saft der [[Zitrone]] mit 2 EL Olivenöl, Salz, Pfeffer und ½ TL Kreuzkümmel verrühren.","Couscous in Schalen geben, Gemüse und Kichererbsen darauf verteilen und mit dem Dressing beträufeln."]},"Pilz-Rahm-Pasta":{"q":"mushroom cream pasta","a":{"Nudeln":"250 g","Champignons":"250 g","Sahne":"200 ml","Zwiebeln":"1 Stück","Knoblauch":"1 Zehe"},"s":["[[Nudeln]] in reichlich Salzwasser nach Packungsanweisung bissfest kochen.","[[Champignons]] putzen und in Scheiben schneiden. [[Zwiebeln]] und [[Knoblauch]] fein würfeln.","1 EL Öl in einer Pfanne bei hoher Hitze erhitzen und die Pilze 5 Minuten braten, bis sie gebräunt sind. Erst dann salzen.","Hitze auf mittel reduzieren, Zwiebeln und Knoblauch zugeben und 2 Minuten mitbraten.","[[Sahne]] zugießen und 3 Minuten leicht einköcheln lassen. Mit Salz, Pfeffer und etwas Petersilie würzen.","Abgegossene Nudeln mit der Soße mischen und servieren."]},"Brokkoli-Reis-Pfanne":{"q":"vegetable fried rice broccoli","a":{"Reis":"150 g","Brokkoli":"1 Kopf","Karotten":"2 Stück","Erbsen":"100 g","Gewürze":"nach Geschmack"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen. Etwas abkühlen lassen.","[[Brokkoli]] in kleine Röschen teilen, [[Karotten]] in dünne Scheiben schneiden.","1 EL Öl in einer großen Pfanne bei hoher Hitze erhitzen. Brokkoli und Karotten 4 Minuten braten.","[[Erbsen]] zugeben und 2 Minuten mitbraten.","Reis zugeben und 3 Minuten unter Rühren anbraten.","Mit 2 EL Sojasoße oder Salz, Pfeffer und ½ TL Currypulver abschmecken."]},"Hackfleisch-Tomaten-Pfanne":{"q":"ground beef pasta tomato","a":{"Hackfleisch":"300 g","Passierte Tomaten":"400 g","Zwiebeln":"1 Stück","Paprika":"1 Stück","Nudeln":"200 g"},"s":["[[Nudeln]] in reichlich Salzwasser nach Packungsanweisung bissfest kochen.","[[Zwiebeln]] fein würfeln, [[Paprika]] in kleine Würfel schneiden.","1 EL Öl in einer großen Pfanne bei hoher Hitze erhitzen. [[Hackfleisch]] darin 5 Minuten krümelig braun anbraten.","Zwiebeln und Paprika zugeben und 3 Minuten mitbraten.","[[Passierte Tomaten]] zugießen, mit Salz, Pfeffer, 1 TL Paprikapulver und 1 TL Oregano würzen und 8 Minuten köcheln lassen.","Abgegossene Nudeln unterheben und servieren."]},"Gnocchi mit Spinat-Sahne":{"q":"gnocchi spinach cream","a":{"Gnocchi":"500 g","Spinat":"200 g","Sahne":"150 ml","Knoblauch":"1 Zehe","Parmesan":"30 g"},"s":["[[Gnocchi]] in kochendes Salzwasser geben. Sobald sie an die Oberfläche steigen (nach 2–3 Minuten), mit einer Schaumkelle herausheben.","[[Knoblauch]] fein hacken und in 1 EL Butter oder Öl bei mittlerer Hitze 1 Minute anschwitzen.","Aufgetauten, ausgedrückten [[Spinat]] zugeben und 2 Minuten erhitzen.","[[Sahne]] zugießen, aufkochen und mit Salz, Pfeffer und Muskat würzen.","Gnocchi in der Soße schwenken und 1 Minute ziehen lassen.","Mit frisch geriebenem [[Parmesan]] bestreuen."]},"Gemüse-Frittata":{"q":"frittata","a":{"Eier":"5 Stück","Zucchini":"1 Stück","Paprika":"1 Stück","Zwiebeln":"1 Stück","Reibekäse":"60 g"},"s":["Backofen auf 180 °C Ober-/Unterhitze (160 °C Umluft) vorheizen.","[[Zucchini]], [[Paprika]] und [[Zwiebeln]] in kleine Würfel schneiden.","1 EL Öl in einer ofenfesten Pfanne (24–26 cm) bei mittlerer Hitze erhitzen und das Gemüse 6 Minuten braten.","[[Eier]] mit 3 EL Milch, Salz und Pfeffer verquirlen und über das Gemüse gießen.","Bei kleiner Hitze 3 Minuten stocken lassen, bis der Rand fest wird. [[Reibekäse]] darüberstreuen.","Pfanne in den Ofen stellen und 10–12 Minuten backen, bis die Mitte fest ist. In Stücke schneiden."]},"Falafel mit Joghurtdip":{"q":"falafel plate","a":{"Falafel":"300 g","Kichererbsen":"½ Dose","Salat":"½ Kopf","Gurke":"½ Stück","Naturjoghurt":"150 g","Zitrone":"½ Stück"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Falafel]] auf einem Blech mit Backpapier verteilen und nach Packungsangabe (meist 12–15 Minuten) knusprig backen, nach der Hälfte wenden.","[[Kichererbsen]] abspülen und abtropfen lassen.","[[Salat]] waschen und zupfen, [[Gurke]] in Scheiben schneiden.","[[Naturjoghurt]] mit dem Saft der [[Zitrone]], Salz, Pfeffer und ½ TL Kreuzkümmel verrühren.","Salat, Gurke und Kichererbsen auf Teller geben, Falafel darauflegen und mit dem Dip servieren."]},"Gemüse-Quiche":{"q":"vegetable quiche","a":{"Blätterteig":"1 Rolle","Eier":"3 Stück","Milch":"150 ml","Brokkoli":"½ Kopf","Karotten":"1 Stück","Reibekäse":"80 g"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Brokkoli]] in kleine Röschen teilen, [[Karotten]] in dünne Scheiben schneiden. Beides 3 Minuten in Salzwasser blanchieren und abtropfen lassen.","[[Blätterteig]] mit dem Backpapier in eine Quiche- oder Springform (26 cm) legen, den Rand hochdrücken und den Boden mehrmals mit einer Gabel einstechen.","[[Eier]] mit [[Milch]], Salz, Pfeffer und Muskat verquirlen.","Gemüse auf dem Teig verteilen, Eiermilch darübergießen und [[Reibekäse]] darüberstreuen.","Auf der unteren Schiene 30–35 Minuten backen, bis die Füllung gestockt und goldbraun ist. 5 Minuten ruhen lassen."]},"Ratatouille mit Baguette":{"q":"ratatouille","a":{"Aubergine":"1 Stück","Zucchini":"1 Stück","Paprika":"1 Stück","Tomaten":"4 Stück","Knoblauch":"2 Zehen","Baguette":"½ Stück"},"s":["[[Aubergine]], [[Zucchini]] und [[Paprika]] in 2 cm große Würfel schneiden. [[Knoblauch]] fein hacken, [[Tomaten]] würfeln.","3 EL Olivenöl in einem breiten Topf bei mittlerer bis hoher Hitze erhitzen. Aubergine 5 Minuten anbraten.","Zucchini und Paprika zugeben und weitere 5 Minuten braten.","Knoblauch und Tomaten zugeben, mit Salz, Pfeffer und 1 TL Kräutern der Provence würzen.","Zugedeckt bei kleiner Hitze 15 Minuten schmoren lassen, gelegentlich umrühren.","Mit aufgeschnittenem [[Baguette]] servieren."]},"Kichererbsen-Bratlinge":{"q":"chickpea patties","a":{"Kichererbsen":"1 Dose","Haferflocken":"50 g","Eier":"1 Stück","Karotten":"1 Stück","Naturjoghurt":"150 g"},"s":["[[Kichererbsen]] abspülen, gut abtropfen lassen und mit einer Gabel grob zerdrücken.","[[Karotten]] fein raspeln. Mit Kichererbsen, [[Haferflocken]], [[Eier]], ½ TL Kreuzkümmel, Salz und Pfeffer zu einer formbaren Masse verkneten.","Masse 10 Minuten quellen lassen. Ist sie zu feucht, 1–2 EL Haferflocken ergänzen.","Mit feuchten Händen 6–8 flache Bratlinge formen.","2 EL Öl in einer Pfanne bei mittlerer Hitze erhitzen und die Bratlinge pro Seite 4 Minuten goldbraun braten.","[[Naturjoghurt]] mit Salz und Zitronensaft verrühren und dazu servieren."]},"Feta-Gemüse-Blech":{"q":"roasted vegetables feta","a":{"Feta":"200 g","Zucchini":"1 Stück","Paprika":"1 Stück","Tomaten":"3 Stück","Olivenöl":"3 EL","Kartoffeln":"500 g"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Kartoffeln]] waschen und in Spalten schneiden. Mit 1 EL [[Olivenöl]] und Salz auf dem Blech mischen und 15 Minuten vorbacken.","[[Zucchini]] und [[Paprika]] in grobe Stücke, [[Tomaten]] in Viertel schneiden.","Gemüse mit dem restlichen Olivenöl, Salz, Pfeffer und 1 TL Oregano mischen und zu den Kartoffeln geben.","[[Feta]] in die Mitte des Blechs legen.","Alles weitere 20 Minuten backen, bis das Gemüse gebräunt und der Feta weich ist."]},"Tofu-Gemüse-Wok":{"q":"tofu stir fry","a":{"Tofu":"200 g","Brokkoli":"½ Kopf","Paprika":"1 Stück","Karotten":"1 Stück","Sojasoße":"3 EL","Reis":"150 g"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Tofu]] trocken tupfen und in 2 cm große Würfel schneiden.","2 EL Öl in einem Wok bei hoher Hitze erhitzen und den Tofu 6–8 Minuten rundum knusprig braten. Herausnehmen.","[[Brokkoli]] in Röschen, [[Paprika]] in Streifen, [[Karotten]] in dünne Scheiben schneiden und im Wok 4 Minuten unter Rühren braten.","Tofu zurück in den Wok geben, mit [[Sojasoße]] und 2 EL Wasser ablöschen und 1 Minute schwenken.","Mit dem Reis servieren."]},"Shakshuka":{"q":"shakshuka","a":{"Eier":"4 Stück","Passierte Tomaten":"400 g","Paprika":"1 Stück","Zwiebeln":"1 Stück","Feta":"75 g","Baguette":"½ Stück"},"s":["[[Zwiebeln]] und [[Paprika]] fein würfeln.","2 EL Olivenöl in einer Pfanne mit Deckel bei mittlerer Hitze erhitzen. Zwiebeln und Paprika 6 Minuten weich dünsten.","1 TL Kreuzkümmel, 1 TL Paprikapulver und eine Prise Chili zugeben und 30 Sekunden anrösten.","[[Passierte Tomaten]] zugießen, salzen und 8 Minuten offen einköcheln lassen, bis die Soße dicklich ist.","Mit einem Löffel 4 Mulden formen und [[Eier]] hineinschlagen. Deckel auflegen und bei kleiner Hitze 6–8 Minuten garen, bis das Eiweiß fest und das Eigelb noch weich ist.","[[Feta]] darüberbröseln und mit [[Baguette]] servieren."]},"Ofenkürbis mit Feta":{"q":"roasted pumpkin feta","a":{"Hokkaido":"750 g","Feta":"150 g","Rote Zwiebeln":"1 Stück","Olivenöl":"3 EL","Naturjoghurt":"150 g"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Hokkaido]] waschen (Schale kann dranbleiben), halbieren, entkernen und in 2 cm breite Spalten schneiden.","[[Rote Zwiebeln]] in Spalten schneiden. Beides mit [[Olivenöl]], Salz, Pfeffer und 1 TL Paprikapulver auf einem Blech mischen.","25 Minuten backen, dann [[Feta]] darüberbröseln und weitere 10 Minuten backen.","[[Naturjoghurt]] mit Salz, Pfeffer und etwas Zitronensaft verrühren.","Kürbis mit dem Joghurtdip servieren."]},"Tomaten-Bohnensalat":{"q":"white bean salad tomato","a":{"Weiße Bohnen":"1 Dose","Tomaten":"3 Stück","Rote Zwiebeln":"1 Stück","Petersilie":"½ Bund","Zitrone":"1 Stück","Olivenöl":"3 EL"},"s":["[[Weiße Bohnen]] in einem Sieb abspülen und abtropfen lassen.","[[Tomaten]] würfeln, [[Rote Zwiebeln]] in feine Ringe schneiden, [[Petersilie]] fein hacken.","Saft der [[Zitrone]] mit [[Olivenöl]], Salz, Pfeffer und einer Prise Zucker verrühren.","Bohnen, Tomaten, Zwiebeln und Petersilie mit dem Dressing mischen.","10 Minuten ziehen lassen und nochmals abschmecken. Dazu passt Brot."]},"Blumenkohl-Curry":{"q":"cauliflower curry","a":{"Blumenkohl":"1 Kopf","Kokosmilch":"1 Dose","Kichererbsen":"1 Dose","Currypaste":"1 EL","Reis":"150 g"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Blumenkohl]] in kleine Röschen teilen.","1 EL Öl in einem Topf bei mittlerer Hitze erhitzen und die [[Currypaste]] 1 Minute anrösten.","[[Kokosmilch]] und 100 ml Wasser einrühren und aufkochen.","Blumenkohl und abgespülte [[Kichererbsen]] zugeben und zugedeckt 12–15 Minuten köcheln lassen, bis der Blumenkohl weich ist.","Mit Salz und Limetten- oder Zitronensaft abschmecken und mit Reis servieren."]},"Penne Arrabbiata":{"q":"penne all'arrabbiata","a":{"Nudeln":"250 g","Passierte Tomaten":"400 g","Knoblauch":"2 Zehen","Chiliflocken":"½ TL","Olivenöl":"2 EL"},"s":["[[Nudeln]] (am besten Penne) in reichlich Salzwasser nach Packungsanweisung bissfest kochen.","[[Knoblauch]] in feine Scheiben schneiden.","[[Olivenöl]] in einer Pfanne bei mittlerer Hitze erwärmen. Knoblauch und [[Chiliflocken]] 1 Minute anschwitzen, ohne dass der Knoblauch braun wird.","[[Passierte Tomaten]] zugießen, salzen und 10 Minuten leicht köcheln lassen.","Nudeln abgießen und in der Soße schwenken.","Mit gehackter Petersilie oder Parmesan servieren."]},"Spaghetti Bolognese":{"q":"spaghetti bolognese","a":{"Spaghetti":"250 g","Hackfleisch":"300 g","Passierte Tomaten":"500 g","Karotten":"1 Stück","Zwiebeln":"1 Stück","Olivenöl":"1 EL"},"s":["[[Zwiebeln]] und [[Karotten]] sehr fein würfeln.","[[Olivenöl]] in einem Topf bei hoher Hitze erhitzen und das [[Hackfleisch]] 5 Minuten krümelig braun anbraten.","Hitze auf mittel reduzieren, Zwiebeln und Karotten zugeben und 4 Minuten mitbraten. 1 EL Tomatenmark zugeben, falls vorhanden.","[[Passierte Tomaten]] zugießen, mit Salz, Pfeffer, 1 TL Oregano und einer Prise Zucker würzen.","Zugedeckt bei kleiner Hitze mindestens 20 Minuten köcheln lassen, gelegentlich umrühren.","In der Zwischenzeit [[Spaghetti]] in reichlich Salzwasser bissfest kochen, abgießen und mit der Soße servieren."]},"Pasta Primavera":{"q":"pasta primavera","a":{"Nudeln":"250 g","Zucchini":"1 Stück","Erbsen":"100 g","Karotten":"1 Stück","Frischkäse":"75 g","Zitrone":"½ Stück"},"s":["[[Nudeln]] in reichlich Salzwasser nach Packungsanweisung bissfest kochen. Eine Tasse Nudelwasser aufheben.","[[Zucchini]] in Halbmonde, [[Karotten]] in dünne Scheiben schneiden.","1 EL Öl in einer Pfanne bei mittlerer Hitze erhitzen. Karotten 3 Minuten braten, Zucchini zugeben und 3 Minuten weiterbraten.","[[Erbsen]] zugeben und 2 Minuten mitgaren.","[[Frischkäse]] mit 4 EL Nudelwasser und dem Saft der [[Zitrone]] unterrühren.","Nudeln unterheben, mit Salz und Pfeffer abschmecken und servieren."]},"Makkaroni-Auflauf":{"q":"macaroni and cheese baked","a":{"Makkaroni":"250 g","Reibekäse":"120 g","Milch":"250 ml","Sahne":"100 ml","Brokkoli":"½ Kopf"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Makkaroni]] in Salzwasser 2 Minuten kürzer als angegeben kochen. 3 Minuten vor Ende die [[Brokkoli]]-Röschen dazugeben. Abgießen.","[[Milch]] und [[Sahne]] verrühren und mit Salz, Pfeffer und Muskat kräftig würzen.","Zwei Drittel vom [[Reibekäse]] unter die Nudeln mischen und alles in eine Auflaufform füllen.","Milch-Sahne darübergießen und mit dem restlichen Käse bestreuen.","25 Minuten backen, bis die Oberfläche goldbraun ist."]},"Zitronen-Ricotta-Pasta":{"q":"pasta ricotta lemon","a":{"Spaghetti":"250 g","Ricotta":"200 g","Zitrone":"1 Stück","Parmesan":"30 g","Spinat":"150 g"},"s":["[[Spaghetti]] in reichlich Salzwasser nach Packungsanweisung bissfest kochen. Eine Tasse Nudelwasser aufheben.","Schale der [[Zitrone]] fein abreiben und den Saft auspressen.","[[Ricotta]] mit Zitronenschale, 2 EL Zitronensaft, geriebenem [[Parmesan]], Salz und Pfeffer glatt rühren.","Aufgetauten, ausgedrückten [[Spinat]] in einer Pfanne mit 1 EL Olivenöl 2 Minuten erhitzen.","Spaghetti abgießen, mit Spinat, Ricottacreme und 4–5 EL Nudelwasser mischen, bis die Soße cremig ist.","Mit Pfeffer und etwas Parmesan servieren."]},"Pesto-Gnocchi mit Tomaten":{"q":"gnocchi pesto","a":{"Gnocchi":"500 g","Pesto":"4 EL","Cherrytomaten":"250 g","Mozzarella":"125 g","Olivenöl":"1 EL"},"s":["[[Cherrytomaten]] halbieren, [[Mozzarella]] in kleine Würfel schneiden.","[[Olivenöl]] in einer großen Pfanne bei mittlerer bis hoher Hitze erhitzen.","[[Gnocchi]] direkt aus der Packung in die Pfanne geben und 6–8 Minuten goldbraun braten, gelegentlich wenden.","Tomaten zugeben und 2 Minuten mitbraten, bis sie leicht weich werden.","Pfanne vom Herd nehmen und [[Pesto]] unterschwenken.","Mozzarella darüber verteilen und sofort servieren."]},"Tortellini in Tomatensahne":{"q":"tortellini cream sauce","a":{"Tortellini":"400 g","Sahne":"100 ml","Passierte Tomaten":"300 g","Spinat":"150 g","Parmesan":"30 g"},"s":["[[Tortellini]] in Salzwasser nach Packungsanweisung garen (meist 2–4 Minuten) und abgießen.","[[Passierte Tomaten]] in einer Pfanne bei mittlerer Hitze aufkochen.","[[Sahne]] einrühren und mit Salz, Pfeffer und 1 TL Italienischen Kräutern würzen.","Aufgetauten, ausgedrückten [[Spinat]] zugeben und 3 Minuten köcheln lassen.","Tortellini in der Soße schwenken.","Mit geriebenem [[Parmesan]] bestreuen und servieren."]},"Pasta mit Lachs und Spinat":{"q":"pasta salmon spinach","a":{"Nudeln":"250 g","Lachsfilet":"250 g","Spinat":"150 g","Sahne":"150 ml","Zitrone":"½ Stück"},"s":["[[Nudeln]] in reichlich Salzwasser nach Packungsanweisung bissfest kochen.","[[Lachsfilet]] (aufgetaut) trocken tupfen und in 2 cm große Würfel schneiden.","1 EL Öl in einer Pfanne bei mittlerer Hitze erhitzen und den Lachs 3 Minuten vorsichtig rundum anbraten. Herausnehmen.","Aufgetauten, ausgedrückten [[Spinat]] in die Pfanne geben, [[Sahne]] zugießen und 3 Minuten köcheln lassen.","Mit Salz, Pfeffer und dem Saft der [[Zitrone]] abschmecken.","Lachs und abgegossene Nudeln vorsichtig unterheben und 1 Minute ziehen lassen."]},"Lasagne klassisch":{"q":"lasagna","a":{"Lasagneplatten":"9 Stück","Hackfleisch":"300 g","Passierte Tomaten":"500 g","Zwiebeln":"1 Stück","Milch":"400 ml","Reibekäse":"100 g"},"s":["[[Zwiebeln]] fein würfeln. [[Hackfleisch]] in 1 EL Öl bei hoher Hitze 5 Minuten krümelig anbraten, Zwiebeln 3 Minuten mitbraten.","[[Passierte Tomaten]] zugießen, mit Salz, Pfeffer und 1 TL Oregano würzen und 10 Minuten köcheln lassen.","Für die Béchamel 2 EL Butter schmelzen, 2 EL Mehl einrühren und 1 Minute anschwitzen. [[Milch]] nach und nach mit dem Schneebesen einrühren und 3 Minuten köcheln, bis sie andickt. Mit Salz und Muskat würzen.","Backofen auf 180 °C Ober-/Unterhitze (160 °C Umluft) vorheizen.","In eine Auflaufform (ca. 20 × 30 cm) abwechselnd etwas Soße, [[Lasagneplatten]], Hacksoße und Béchamel schichten. Mit Béchamel abschließen.","[[Reibekäse]] darüberstreuen und 35–40 Minuten backen. Vor dem Anschneiden 10 Minuten ruhen lassen."]},"Nudel-Salat mit Pesto":{"q":"pasta salad pesto","a":{"Nudeln":"250 g","Pesto":"4 EL","Cherrytomaten":"200 g","Rucola":"50 g","Mozzarella":"125 g"},"s":["[[Nudeln]] in reichlich Salzwasser bissfest kochen, abgießen und kalt abschrecken.","[[Cherrytomaten]] halbieren, [[Mozzarella]] in kleine Würfel schneiden.","Nudeln mit [[Pesto]] und 2 EL Wasser mischen, damit der Salat saftig bleibt.","Tomaten und Mozzarella unterheben. Mit Salz und Pfeffer abschmecken.","[[Rucola]] waschen und erst kurz vor dem Servieren unterheben, damit er knackig bleibt."]},"Rigatoni mit Pilzen":{"q":"rigatoni mushrooms","a":{"Rigatoni":"250 g","Champignons":"300 g","Sahne":"150 ml","Knoblauch":"1 Zehe","Parmesan":"30 g"},"s":["[[Rigatoni]] in reichlich Salzwasser nach Packungsanweisung bissfest kochen.","[[Champignons]] putzen und vierteln, [[Knoblauch]] fein hacken.","1 EL Öl in einer großen Pfanne bei hoher Hitze erhitzen. Pilze 6 Minuten kräftig anbraten, bis sie gebräunt sind.","Hitze reduzieren, Knoblauch 1 Minute mitbraten, dann [[Sahne]] zugießen und 3 Minuten köcheln lassen.","Mit Salz, Pfeffer und Petersilie würzen. Abgegossene Rigatoni unterheben.","Mit geriebenem [[Parmesan]] servieren."]},"Spaghetti Aglio e Olio":{"q":"spaghetti aglio e olio","a":{"Spaghetti":"250 g","Knoblauch":"4 Zehen","Olivenöl":"5 EL","Chiliflocken":"½ TL","Petersilie":"½ Bund"},"s":["[[Spaghetti]] in reichlich gut gesalzenem Wasser bissfest kochen. Eine Tasse Nudelwasser aufheben.","[[Knoblauch]] in sehr dünne Scheiben schneiden, [[Petersilie]] fein hacken.","[[Olivenöl]] in einer großen Pfanne bei kleiner bis mittlerer Hitze erwärmen. Knoblauch und [[Chiliflocken]] 2–3 Minuten sanft braten, bis der Knoblauch hellgolden ist (nicht dunkel werden lassen, sonst wird er bitter).","Spaghetti abgießen und mit 4 EL Nudelwasser in die Pfanne geben.","Kräftig schwenken, bis sich eine leicht gebundene Soße bildet.","Petersilie unterheben, mit Salz abschmecken und sofort servieren."]},"Kartoffelgratin":{"q":"gratin dauphinois","a":{"Kartoffeln":"700 g","Sahne":"150 ml","Milch":"150 ml","Knoblauch":"1 Zehe","Reibekäse":"80 g"},"s":["Backofen auf 180 °C Ober-/Unterhitze (160 °C Umluft) vorheizen.","Eine Auflaufform mit Butter einfetten und mit der halbierten [[Knoblauch]]-Zehe ausreiben.","[[Kartoffeln]] (festkochend) schälen und in 2–3 mm dünne Scheiben hobeln.","[[Sahne]] und [[Milch]] mit 1 TL Salz, Pfeffer und Muskat verrühren.","Kartoffelscheiben dachziegelartig in die Form schichten und die Sahnemilch darübergießen.","[[Reibekäse]] darüberstreuen und 45–50 Minuten backen, bis die Kartoffeln weich und die Oberfläche goldbraun ist."]},"Bratkartoffeln mit Spiegelei":{"q":"Bratkartoffeln Spiegelei","a":{"Kartoffeln":"700 g","Eier":"4 Stück","Zwiebeln":"1 Stück","Öl":"3 EL","Gewürze":"nach Geschmack"},"s":["[[Kartoffeln]] (festkochend, am besten vom Vortag gekocht) pellen und in 5 mm dicke Scheiben schneiden. Rohe Kartoffeln vorher 15 Minuten in der Schale kochen.","[[Zwiebeln]] in Würfel schneiden.","2 EL [[Öl]] in einer großen Pfanne bei mittlerer bis hoher Hitze erhitzen. Kartoffeln in einer Lage hineingeben und 5 Minuten braten, ohne zu rühren.","Wenden und weitere 8 Minuten braten, bis sie rundum knusprig sind. Zwiebeln die letzten 3 Minuten mitbraten. Mit Salz, Pfeffer und Paprikapulver würzen.","Restliches Öl in einer zweiten Pfanne bei mittlerer Hitze erhitzen, [[Eier]] hineinschlagen und 3–4 Minuten braten, bis das Eiweiß fest ist.","Bratkartoffeln mit den Spiegeleiern anrichten."]},"Kartoffel-Lauch-Suppe":{"q":"potato leek soup","a":{"Kartoffeln":"500 g","Lauch":"1 Stange","Karotten":"1 Stück","Gemüsebrühe":"800 ml","Sahne":"100 ml"},"s":["[[Lauch]] längs halbieren, gründlich waschen und in feine Ringe schneiden.","[[Kartoffeln]] und [[Karotten]] schälen und in kleine Würfel schneiden.","1 EL Butter oder Öl in einem Topf bei mittlerer Hitze erhitzen und den Lauch 4 Minuten andünsten.","Kartoffeln und Karotten zugeben, mit [[Gemüsebrühe]] ablöschen und zugedeckt 15–18 Minuten köcheln lassen.","Die Hälfte der Suppe pürieren (oder mit dem Kartoffelstampfer grob zerdrücken) und wieder untermischen.","[[Sahne]] einrühren und mit Salz, Pfeffer und Muskat abschmecken."]},"Süßkartoffel-Pommes mit Dip":{"q":"sweet potato fries","a":{"Süßkartoffeln":"600 g","Olivenöl":"2 EL","Naturjoghurt":"150 g","Knoblauch":"1 Zehe","Salat":"½ Kopf"},"s":["Backofen auf 220 °C Ober-/Unterhitze (200 °C Umluft) vorheizen.","[[Süßkartoffeln]] schälen und in 1 cm dicke Stifte schneiden.","Mit [[Olivenöl]], 1 TL Speisestärke (falls vorhanden), Salz und 1 TL Paprikapulver mischen.","In einer Lage mit Abstand auf einem Blech mit Backpapier verteilen und 25–30 Minuten backen, nach 15 Minuten wenden.","[[Naturjoghurt]] mit fein geriebenem [[Knoblauch]], Salz und Pfeffer verrühren.","[[Salat]] waschen und mit etwas Öl und Essig anmachen. Pommes mit Dip und Salat servieren."]},"Ofenkartoffeln mit Thunfisch":{"q":"baked potato tuna","a":{"Kartoffeln":"4 Stück","Thunfisch":"1 Dose","Naturjoghurt":"150 g","Mais":"½ Dose","Frühlingszwiebeln":"2 Stück"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Kartoffeln]] (groß, mehligkochend) waschen, mehrmals einstechen, mit Öl und Salz einreiben und 45–50 Minuten backen.","[[Thunfisch]] abtropfen lassen und zerpflücken. [[Mais]] abspülen.","[[Frühlingszwiebeln]] in feine Ringe schneiden.","Thunfisch, Mais, Frühlingszwiebeln und [[Naturjoghurt]] mischen und mit Salz, Pfeffer und Zitronensaft abschmecken.","Kartoffeln längs aufschneiden, leicht aufdrücken und mit der Thunfischcreme füllen."]},"Kartoffelpuffer mit Apfelmus":{"q":"Kartoffelpuffer Apfelmus","a":{"Kartoffeln":"800 g","Eier":"1 Stück","Mehl":"2 EL","Zwiebeln":"1 Stück","Apfelmus":"1 Glas"},"s":["[[Kartoffeln]] schälen und fein reiben, [[Zwiebeln]] ebenfalls fein reiben.","Die Masse in ein sauberes Küchentuch geben und kräftig ausdrücken, damit möglichst viel Flüssigkeit herausläuft.","Mit [[Eier]], [[Mehl]], 1 TL Salz und einer Prise Muskat zu einem Teig verrühren.","Reichlich Öl (ca. 5 mm hoch) in einer Pfanne bei mittlerer bis hoher Hitze erhitzen.","Pro Puffer 2 EL Teig hineingeben, flach drücken und pro Seite 3–4 Minuten goldbraun und knusprig braten. Auf Küchenpapier abtropfen lassen.","Heiß mit [[Apfelmus]] servieren."]},"Gebackene Rosmarinkartoffeln":{"q":"roasted potatoes rosemary","a":{"Kartoffeln":"700 g","Rosmarin":"2 Zweige","Olivenöl":"3 EL","Knoblauch":"3 Zehen","Feta":"100 g"},"s":["Backofen auf 220 °C Ober-/Unterhitze (200 °C Umluft) vorheizen.","[[Kartoffeln]] gründlich waschen und je nach Größe halbieren oder vierteln.","Mit [[Olivenöl]], 1 TL grobem Salz und den abgezupften Nadeln vom [[Rosmarin]] auf einem Blech mischen.","[[Knoblauch]]-Zehen mit der Schale leicht andrücken und dazulegen.","35–40 Minuten backen, nach 20 Minuten einmal wenden, bis die Kartoffeln außen knusprig sind.","Mit zerbröseltem [[Feta]] bestreuen und servieren."]},"Bauernfrühstück":{"q":"Bauernfrühstück","a":{"Kartoffeln":"600 g","Eier":"4 Stück","Zwiebeln":"1 Stück","Kochschinken":"100 g","Öl":"2 EL"},"s":["[[Kartoffeln]] (gekocht, am besten vom Vortag) pellen und in Scheiben schneiden.","[[Zwiebeln]] würfeln, [[Kochschinken]] in Streifen schneiden.","[[Öl]] in einer großen Pfanne bei mittlerer bis hoher Hitze erhitzen und die Kartoffeln 10 Minuten goldbraun braten, nur gelegentlich wenden.","Zwiebeln und Schinken zugeben und 3 Minuten mitbraten.","[[Eier]] mit 2 EL Milch, Salz und Pfeffer verquirlen und über die Kartoffeln gießen.","Bei kleiner Hitze 3–4 Minuten stocken lassen, dabei vorsichtig wenden. Mit Schnittlauch oder Gewürzgurke servieren."]},"Kartoffel-Gulasch":{"q":"Kartoffelgulasch","a":{"Kartoffeln":"600 g","Paprika":"1 Stück","Zwiebeln":"2 Stück","Passierte Tomaten":"200 g","Gemüsebrühe":"500 ml"},"s":["[[Zwiebeln]] würfeln, [[Kartoffeln]] schälen und in 2 cm große Würfel schneiden, [[Paprika]] würfeln.","2 EL Öl in einem Topf bei mittlerer Hitze erhitzen und die Zwiebeln 5 Minuten goldgelb dünsten.","2 TL edelsüßes Paprikapulver und ½ TL Kümmel einrühren und nur 20 Sekunden anrösten.","Sofort mit [[Gemüsebrühe]] ablöschen, Kartoffeln, Paprika und [[Passierte Tomaten]] zugeben.","Zugedeckt 20 Minuten köcheln lassen, bis die Kartoffeln weich sind und die Soße sämig wird.","Mit Salz, Pfeffer und 1 TL Majoran abschmecken."]},"Gefüllte Kartoffelschalen":{"q":"potato skins cheese","a":{"Kartoffeln":"4 Stück","Reibekäse":"100 g","Frühlingszwiebeln":"2 Stück","Naturjoghurt":"150 g","Mais":"½ Dose"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Kartoffeln]] (groß) waschen, einstechen und 40 Minuten im Ofen backen. Kurz abkühlen lassen.","Kartoffeln längs halbieren und mit einem Löffel aushöhlen, dabei einen 5 mm Rand lassen.","Kartoffelinneres mit abgespültem [[Mais]], der Hälfte vom [[Reibekäse]], Salz und Pfeffer mischen.","Masse in die Schalen füllen, mit restlichem Käse bestreuen und 12–15 Minuten goldbraun überbacken.","[[Frühlingszwiebeln]] in Ringe schneiden, [[Naturjoghurt]] salzen. Kartoffeln mit Joghurt und Frühlingszwiebeln servieren."]},"Süßkartoffel-Erdnuss-Curry":{"q":"sweet potato peanut curry","a":{"Süßkartoffeln":"500 g","Erdnussmus":"2 EL","Kokosmilch":"1 Dose","Spinat":"150 g","Reis":"150 g"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Süßkartoffeln]] schälen und in 2 cm große Würfel schneiden.","1 EL Öl in einem Topf bei mittlerer Hitze erhitzen, 1 TL Currypulver und etwas geriebenen Ingwer 30 Sekunden anrösten.","Süßkartoffeln, [[Kokosmilch]] und 150 ml Wasser zugeben und zugedeckt 15 Minuten köcheln lassen.","[[Erdnussmus]] einrühren, [[Spinat]] (aufgetaut) zugeben und 3 Minuten köcheln.","Mit Salz, Sojasoße und Limettensaft abschmecken und mit Reis servieren."]},"Kartoffel-Brokkoli-Auflauf":{"q":"potato broccoli casserole","a":{"Kartoffeln":"600 g","Brokkoli":"1 Kopf","Sahne":"200 ml","Reibekäse":"100 g","Zwiebeln":"1 Stück"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Kartoffeln]] schälen, in 5 mm dicke Scheiben schneiden und in Salzwasser 8 Minuten vorkochen. In den letzten 3 Minuten die [[Brokkoli]]-Röschen mitgaren. Abgießen.","[[Zwiebeln]] fein würfeln und in 1 EL Butter 3 Minuten glasig dünsten.","[[Sahne]] zugießen, mit Salz, Pfeffer und Muskat kräftig würzen und kurz aufkochen.","Kartoffeln und Brokkoli in eine Auflaufform geben, Sahne darübergießen und [[Reibekäse]] darüberstreuen.","20–25 Minuten goldbraun backen."]},"Hähnchen-Curry mit Reis":{"q":"chicken curry rice","a":{"Hähnchenbrust":"300 g","Reis":"150 g","Kokosmilch":"1 Dose","Currypaste":"1 EL","Paprika":"1 Stück"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Hähnchenbrust]] in mundgerechte Stücke, [[Paprika]] in Streifen schneiden.","1 EL Öl in einer Pfanne bei hoher Hitze erhitzen und das Hähnchen 4 Minuten rundum anbraten.","[[Currypaste]] zugeben und 1 Minute mitrösten.","[[Kokosmilch]] und Paprika zugeben und 8–10 Minuten bei mittlerer Hitze köcheln lassen, bis das Hähnchen durchgegart ist.","Mit Salz, Sojasoße und Limettensaft abschmecken und mit Reis servieren."]},"Hähnchen-Fajitas":{"q":"chicken fajitas","a":{"Hähnchenbrust":"300 g","Wraps":"4 Stück","Paprika":"2 Stück","Zwiebeln":"1 Stück","Naturjoghurt":"150 g"},"s":["[[Hähnchenbrust]] in dünne Streifen schneiden und mit 1 TL Paprikapulver, ½ TL Kreuzkümmel, Salz, Pfeffer und 1 EL Öl mischen.","[[Paprika]] und [[Zwiebeln]] in Streifen schneiden.","Eine große Pfanne bei hoher Hitze erhitzen und das Hähnchen 5 Minuten braten, bis es durch ist. Herausnehmen.","Paprika und Zwiebeln in der Pfanne 5 Minuten braten, sie sollen noch Biss haben. Hähnchen wieder dazugeben.","[[Wraps]] in einer trockenen Pfanne kurz erwärmen.","Wraps mit Hähnchen-Gemüse und gesalzenem [[Naturjoghurt]] füllen und einrollen."]},"Hähnchen mit Zitronenreis":{"q":"lemon chicken rice","a":{"Hähnchenbrust":"300 g","Reis":"150 g","Zitrone":"1 Stück","Knoblauch":"1 Zehe","Erbsen":"100 g"},"s":["[[Reis]] abspülen und mit der doppelten Menge Salzwasser und der abgeriebenen Schale der [[Zitrone]] aufkochen. Zugedeckt bei kleiner Hitze 15 Minuten garen, [[Erbsen]] die letzten 4 Minuten mitgaren.","[[Hähnchenbrust]] waagerecht halbieren, damit dünne Schnitzel entstehen. Mit Salz und Pfeffer würzen.","1 EL Öl in einer Pfanne bei mittlerer bis hoher Hitze erhitzen und das Hähnchen pro Seite 4 Minuten braten, bis es durchgegart ist.","Fein gehackten [[Knoblauch]] und den Saft der Zitrone in die Pfanne geben und 1 Minute einkochen lassen.","Hähnchen in der Zitronensoße wenden.","Mit dem Zitronenreis servieren."]},"Hähnchenschenkel vom Blech":{"q":"roast chicken legs potatoes","a":{"Hähnchenschenkel":"2 Stück","Kartoffeln":"600 g","Karotten":"2 Stück","Olivenöl":"2 EL","Knoblauch":"2 Zehen"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Hähnchenschenkel]] trocken tupfen und mit 1 EL [[Olivenöl]], Salz, Pfeffer und 2 TL Paprikapulver einreiben.","[[Kartoffeln]] waschen und vierteln, [[Karotten]] schälen und in grobe Stücke schneiden. Mit dem restlichen Öl, Salz und Rosmarin mischen.","Gemüse auf dem Blech verteilen, die Schenkel mit der Hautseite nach oben darauflegen und [[Knoblauch]]-Zehen dazugeben.","45–50 Minuten backen, bis die Haut knusprig ist und beim Einstechen klarer Saft austritt (Kerntemperatur 80 °C).","5 Minuten ruhen lassen und servieren."]},"Hähnchen-Brokkoli-Pfanne":{"q":"chicken broccoli stir fry","a":{"Hähnchenbrust":"300 g","Brokkoli":"1 Kopf","Reis":"150 g","Sojasoße":"3 EL","Knoblauch":"1 Zehe"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Hähnchenbrust]] in dünne Streifen schneiden, [[Brokkoli]] in kleine Röschen teilen, [[Knoblauch]] hacken.","1 EL Öl in einer Pfanne bei hoher Hitze erhitzen und das Hähnchen 4–5 Minuten braten. Herausnehmen.","Brokkoli mit 3 EL Wasser in die Pfanne geben, Deckel auflegen und 3 Minuten dämpfen.","Knoblauch und Hähnchen zugeben, [[Sojasoße]] mit 1 TL Honig verrühren und dazugeben. 1 Minute schwenken.","Mit Reis servieren, nach Wunsch mit Sesam bestreuen."]},"Hähnchen-Nudel-Suppe":{"q":"chicken noodle soup","a":{"Hähnchenbrust":"250 g","Nudeln":"100 g","Karotten":"2 Stück","Lauch":"½ Stange","Gemüsebrühe":"1 l"},"s":["[[Gemüsebrühe]] in einem Topf aufkochen. [[Hähnchenbrust]] im Ganzen hineinlegen und bei kleiner Hitze 15 Minuten gar ziehen lassen.","[[Karotten]] in Scheiben, [[Lauch]] in Ringe schneiden.","Hähnchen herausnehmen und mit zwei Gabeln in Stücke zupfen.","Karotten und Lauch in die Brühe geben und 5 Minuten köcheln lassen.","[[Nudeln]] (am besten Suppennudeln) zugeben und nach Packungsanweisung garen.","Hähnchen zurück in die Suppe geben, mit Salz, Pfeffer und Petersilie abschmecken."]},"Chicken-Wrap mit Avocado":{"q":"chicken wrap avocado","a":{"Hähnchenbrust":"250 g","Wraps":"4 Stück","Avocado":"1 Stück","Salat":"½ Kopf","Tomaten":"2 Stück"},"s":["[[Hähnchenbrust]] mit Salz, Pfeffer und 1 TL Paprikapulver würzen.","1 EL Öl in einer Pfanne bei mittlerer bis hoher Hitze erhitzen und das Hähnchen pro Seite 5–6 Minuten braten, bis es durch ist. Kurz ruhen lassen und in Streifen schneiden.","[[Avocado]] mit Salz und Zitronensaft zerdrücken.","[[Salat]] in Streifen, [[Tomaten]] in Würfel schneiden.","[[Wraps]] kurz in einer trockenen Pfanne erwärmen und mit Avocadocreme bestreichen.","Salat, Tomaten und Hähnchen darauf verteilen, fest einrollen und halbieren."]},"Hähnchen-Gyros mit Tzatziki":{"q":"gyros tzatziki","a":{"Hähnchenbrust":"300 g","Reis":"150 g","Gurke":"½ Stück","Naturjoghurt":"250 g","Knoblauch":"2 Zehen"},"s":["[[Hähnchenbrust]] in dünne Streifen schneiden und mit 1 EL Öl, 1 TL Paprikapulver, 1 TL Oregano, ½ TL Kreuzkümmel, Salz und Pfeffer mindestens 10 Minuten marinieren.","[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","Für das Tzatziki [[Gurke]] grob raspeln, mit etwas Salz mischen, 5 Minuten ziehen lassen und gut ausdrücken.","Gurke mit [[Naturjoghurt]], fein geriebenem [[Knoblauch]], 1 EL Olivenöl, Salz und Pfeffer verrühren.","Eine Pfanne bei hoher Hitze erhitzen und das Hähnchen 6–7 Minuten braten, bis es gebräunt und durchgegart ist.","Mit Reis und Tzatziki servieren."]},"Hähnchen-Tomaten-Pfanne":{"q":"chicken pasta spinach tomato","a":{"Hähnchenbrust":"250 g","Cherrytomaten":"200 g","Spinat":"150 g","Frischkäse":"75 g","Nudeln":"200 g"},"s":["[[Nudeln]] in reichlich Salzwasser nach Packungsanweisung bissfest kochen. Eine Tasse Nudelwasser aufheben.","[[Hähnchenbrust]] in Würfel schneiden, mit Salz und Pfeffer würzen und in 1 EL Öl bei hoher Hitze 5 Minuten braten.","Halbierte [[Cherrytomaten]] zugeben und 2 Minuten mitbraten.","Aufgetauten, ausgedrückten [[Spinat]] und [[Frischkäse]] mit 100 ml Nudelwasser einrühren und 2 Minuten köcheln.","Mit Salz, Pfeffer und 1 TL Italienischen Kräutern abschmecken.","Nudeln unterheben und servieren."]},"Hähnchen-Schaschlik":{"q":"chicken skewers peppers","a":{"Hähnchenbrust":"300 g","Paprika":"1 Stück","Zwiebeln":"1 Stück","Reis":"150 g","Naturjoghurt":"150 g"},"s":["[[Hähnchenbrust]] in 3 cm große Würfel schneiden und mit 1 EL Öl, 1 TL Paprikapulver, Salz und Pfeffer mischen.","[[Paprika]] und [[Zwiebeln]] in 3 cm große Stücke schneiden.","Fleisch und Gemüse abwechselnd auf Spieße stecken.","[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","Spieße in einer Grillpfanne bei mittlerer bis hoher Hitze 10–12 Minuten rundum braten, bis das Hähnchen durch ist.","[[Naturjoghurt]] mit Salz, Knoblauch und Kräutern verrühren und mit Reis und Spießen servieren."]},"Hähnchen-Pesto-Auflauf":{"q":"pasta bake chicken","a":{"Hähnchenbrust":"250 g","Nudeln":"200 g","Pesto":"4 EL","Reibekäse":"80 g","Cherrytomaten":"200 g"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Nudeln]] in Salzwasser 2 Minuten kürzer als angegeben kochen und abgießen.","[[Hähnchenbrust]] in Würfel schneiden, salzen und in 1 EL Öl 4 Minuten anbraten.","Nudeln, Hähnchen, [[Pesto]], halbierte [[Cherrytomaten]] und 100 ml Wasser oder Sahne mischen.","In eine Auflaufform füllen und mit [[Reibekäse]] bestreuen.","20 Minuten backen, bis der Käse goldbraun ist."]},"Hähnchen-Kokos-Suppe":{"q":"tom kha gai","a":{"Hähnchenbrust":"250 g","Kokosmilch":"1 Dose","Champignons":"150 g","Limette":"1 Stück","Reis":"100 g"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Hähnchenbrust]] in dünne Streifen, [[Champignons]] in Scheiben schneiden.","[[Kokosmilch]] mit 300 ml Wasser oder Brühe, 1 TL geriebenem Ingwer und 1 TL Currypaste aufkochen.","Hähnchen und Pilze zugeben und bei kleiner Hitze 8 Minuten köcheln lassen, bis das Fleisch gar ist.","Mit dem Saft der [[Limette]], 1 EL Sojasoße und etwas Zucker abschmecken.","Suppe in Schalen füllen und je eine Portion Reis hineingeben."]},"Frikadellen mit Kartoffeln":{"q":"Frikadellen Kartoffeln","a":{"Hackfleisch":"400 g","Kartoffeln":"600 g","Eier":"1 Stück","Zwiebeln":"1 Stück","Paniermehl":"3 EL"},"s":["[[Kartoffeln]] schälen und in Salzwasser 20 Minuten weich kochen.","[[Zwiebeln]] sehr fein würfeln.","[[Hackfleisch]] mit Zwiebeln, [[Eier]], [[Paniermehl]], 1 TL Senf, 1 TL Salz, Pfeffer und 1 TL Paprikapulver gründlich verkneten.","Mit feuchten Händen 6 flache Frikadellen formen.","2 EL Öl in einer Pfanne bei mittlerer Hitze erhitzen und die Frikadellen pro Seite 5–6 Minuten braten, bis sie durchgegart sind.","Kartoffeln abgießen und mit den Frikadellen servieren, dazu passt Gurkensalat."]},"Gefüllte Paprika mit Hack":{"q":"stuffed peppers","a":{"Paprika":"4 Stück","Hackfleisch":"250 g","Reis":"75 g","Passierte Tomaten":"400 g","Zwiebeln":"1 Stück"},"s":["[[Reis]] in der doppelten Menge Salzwasser 10 Minuten vorgaren und abgießen.","[[Zwiebeln]] fein würfeln und mit [[Hackfleisch]], Reis, Salz, Pfeffer und 1 TL Paprikapulver verkneten.","Von den [[Paprika]] einen Deckel abschneiden und die Kerne entfernen. Mit der Hackmasse füllen und Deckel aufsetzen.","[[Passierte Tomaten]] mit 150 ml Wasser in einen breiten Topf geben, salzen und aufkochen.","Paprika aufrecht hineinstellen und zugedeckt bei kleiner Hitze 35–40 Minuten schmoren.","Soße abschmecken und mit den Paprika servieren."]},"Chili con Carne":{"q":"chili con carne","a":{"Hackfleisch":"300 g","Kidneybohnen":"1 Dose","Mais":"½ Dose","Passierte Tomaten":"400 g","Zwiebeln":"1 Stück"},"s":["[[Zwiebeln]] fein würfeln.","1 EL Öl in einem Topf bei hoher Hitze erhitzen und das [[Hackfleisch]] 5 Minuten krümelig braun anbraten.","Zwiebeln zugeben und 3 Minuten mitbraten. 1 TL Kreuzkümmel, 1 TL Paprikapulver und ½–1 TL Chilipulver einrühren.","[[Passierte Tomaten]] zugießen, abgespülte [[Kidneybohnen]] und [[Mais]] zugeben.","Zugedeckt bei kleiner Hitze 20 Minuten köcheln lassen, gelegentlich umrühren.","Mit Salz, Pfeffer und einer Prise Zucker abschmecken. Dazu passt Brot oder Reis."]},"Hack-Lauch-Pfanne":{"q":"leek minced meat","a":{"Hackfleisch":"300 g","Lauch":"1 Stange","Frischkäse":"100 g","Kartoffeln":"500 g","Knoblauch":"1 Zehe"},"s":["[[Kartoffeln]] schälen und in Salzwasser 20 Minuten weich kochen.","[[Lauch]] längs halbieren, waschen und in Ringe schneiden, [[Knoblauch]] hacken.","1 EL Öl in einer Pfanne bei hoher Hitze erhitzen und das [[Hackfleisch]] 5 Minuten krümelig anbraten.","Lauch und Knoblauch zugeben und 5 Minuten mitbraten, bis der Lauch weich ist.","[[Frischkäse]] mit 100 ml Wasser einrühren und 2 Minuten köcheln. Mit Salz, Pfeffer und Muskat abschmecken.","Mit den Kartoffeln servieren."]},"Köttbullar mit Reis":{"q":"köttbullar","a":{"Hackfleisch":"300 g","Reis":"150 g","Eier":"1 Stück","Sahne":"150 ml","Zwiebeln":"1 Stück"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Zwiebeln]] sehr fein würfeln und mit [[Hackfleisch]], [[Eier]], 2 EL Paniermehl, Salz, Pfeffer und einer Prise Piment verkneten.","Mit feuchten Händen walnussgroße Bällchen formen (etwa 20 Stück).","2 EL Öl in einer Pfanne bei mittlerer Hitze erhitzen und die Bällchen 8–10 Minuten rundum braun braten. Herausnehmen.","Bratensatz mit 100 ml Brühe und der [[Sahne]] ablöschen, 1 TL Sojasoße zugeben und 3 Minuten einkochen lassen.","Bällchen in der Soße wenden und mit Reis servieren."]},"Burger selbst gemacht":{"q":"hamburger homemade","a":{"Hackfleisch":"300 g","Burgerbrötchen":"2 Stück","Salat":"4 Blätter","Tomaten":"1 Stück","Reibekäse":"40 g"},"s":["[[Hackfleisch]] mit 1 TL Salz und Pfeffer kurz verkneten und zu 2 flachen Patties (etwas größer als die Brötchen) formen. In die Mitte eine kleine Mulde drücken.","[[Tomaten]] in Scheiben schneiden, [[Salat]] waschen.","Eine Pfanne ohne Öl bei hoher Hitze sehr heiß werden lassen. Patties pro Seite 3–4 Minuten braten.","Nach dem Wenden [[Reibekäse]] auf die Patties geben und mit Deckel schmelzen lassen.","[[Burgerbrötchen]] aufschneiden und mit der Schnittfläche 1 Minute in der Pfanne anrösten.","Brötchen mit Ketchup oder Senf, Salat, Patty und Tomate belegen."]},"Hackfleisch-Reis-Pfanne":{"q":"ground beef rice","a":{"Hackfleisch":"300 g","Reis":"150 g","Paprika":"1 Stück","Mais":"½ Dose","Zwiebeln":"1 Stück"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Zwiebeln]] und [[Paprika]] würfeln, [[Mais]] abspülen.","1 EL Öl in einer großen Pfanne bei hoher Hitze erhitzen und das [[Hackfleisch]] 5 Minuten krümelig braten.","Zwiebeln und Paprika zugeben und 4 Minuten mitbraten. Mit Salz, Pfeffer, 1 TL Paprikapulver und ½ TL Kreuzkümmel würzen.","Reis und Mais zugeben und alles 3 Minuten unter Rühren braten.","Mit 2 EL Tomatenmark oder Ketchup abrunden und servieren."]},"Bolognese mit Zucchininudeln":{"q":"zucchini noodles bolognese","a":{"Hackfleisch":"300 g","Zucchini":"2 Stück","Passierte Tomaten":"400 g","Karotten":"1 Stück","Zwiebeln":"1 Stück"},"s":["[[Zwiebeln]] und [[Karotten]] fein würfeln.","[[Hackfleisch]] in 1 EL Öl bei hoher Hitze 5 Minuten krümelig anbraten, Zwiebeln und Karotten 3 Minuten mitbraten.","[[Passierte Tomaten]] zugießen, mit Salz, Pfeffer und 1 TL Oregano würzen und 15 Minuten köcheln lassen.","[[Zucchini]] mit einem Spiralschneider in Nudeln schneiden (oder mit dem Sparschäler in breite Streifen).","Zucchininudeln in einer Pfanne mit 1 TL Öl bei mittlerer Hitze nur 2 Minuten erwärmen und leicht salzen, damit sie nicht matschig werden.","Zucchininudeln mit der Bolognese servieren."]},"Taco-Pfanne":{"q":"taco meat beans corn","a":{"Hackfleisch":"300 g","Kidneybohnen":"½ Dose","Mais":"½ Dose","Paprika":"1 Stück","Tortillachips":"100 g"},"s":["[[Paprika]] würfeln, [[Kidneybohnen]] und [[Mais]] abspülen.","1 EL Öl in einer Pfanne bei hoher Hitze erhitzen und das [[Hackfleisch]] 5 Minuten krümelig braten.","Paprika zugeben und 3 Minuten mitbraten.","1 TL Paprikapulver, 1 TL Kreuzkümmel, ½ TL Chilipulver, 1 EL Tomatenmark und 100 ml Wasser einrühren.","Bohnen und Mais zugeben und 5 Minuten köcheln lassen, bis die Soße eingedickt ist. Mit Salz abschmecken.","Mit [[Tortillachips]] zum Dippen servieren, nach Wunsch mit Joghurt und Käse."]},"Hackbällchen in Tomatensoße":{"q":"spaghetti meatballs","a":{"Hackfleisch":"300 g","Eier":"1 Stück","Paniermehl":"3 EL","Passierte Tomaten":"500 g","Spaghetti":"250 g"},"s":["[[Hackfleisch]] mit [[Eier]], [[Paniermehl]], 1 TL Salz, Pfeffer und 1 TL Oregano verkneten und zu etwa 16 Bällchen formen.","2 EL Öl in einer tiefen Pfanne bei mittlerer bis hoher Hitze erhitzen und die Bällchen 6 Minuten rundum anbraten.","[[Passierte Tomaten]] zugießen, salzen, 1 Prise Zucker zugeben.","Zugedeckt bei kleiner Hitze 15 Minuten köcheln lassen, bis die Bällchen durchgegart sind.","Inzwischen [[Spaghetti]] in reichlich Salzwasser bissfest kochen.","Spaghetti mit Bällchen und Soße servieren, nach Wunsch mit Parmesan."]},"Puten-Geschnetzeltes":{"q":"Geschnetzeltes Champignons","a":{"Putenbrust":"300 g","Champignons":"200 g","Sahne":"150 ml","Reis":"150 g","Zwiebeln":"1 Stück"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Putenbrust]] in dünne Streifen schneiden, [[Champignons]] in Scheiben, [[Zwiebeln]] in feine Würfel.","1 EL Öl in einer Pfanne bei hoher Hitze erhitzen und das Fleisch 3–4 Minuten anbraten. Salzen, pfeffern, herausnehmen.","Pilze in der Pfanne 4 Minuten braun braten, Zwiebeln 2 Minuten mitbraten.","[[Sahne]] und 100 ml Brühe zugießen und 3 Minuten einköcheln lassen. 1 TL Paprikapulver einrühren.","Fleisch zurück in die Soße geben, 1 Minute erhitzen und mit Reis servieren."]},"Würstchen-Gemüse-Topf":{"q":"Eintopf Würstchen","a":{"Wiener Würstchen":"4 Stück","Kartoffeln":"400 g","Karotten":"2 Stück","Erbsen":"100 g","Gemüsebrühe":"800 ml"},"s":["[[Kartoffeln]] und [[Karotten]] schälen und in 1 cm große Würfel schneiden.","1 EL Öl in einem Topf erhitzen und das Gemüse 2 Minuten andünsten.","[[Gemüsebrühe]] zugießen und zugedeckt 12 Minuten köcheln lassen.","[[Wiener Würstchen]] in Scheiben schneiden und mit den [[Erbsen]] zugeben.","Weitere 5 Minuten bei kleiner Hitze ziehen lassen (nicht sprudelnd kochen, sonst platzen die Würstchen).","Mit Salz, Pfeffer, Majoran und Petersilie abschmecken."]},"Lachs aus dem Ofen":{"q":"baked salmon broccoli","a":{"Lachsfilet":"300 g","Kartoffeln":"500 g","Brokkoli":"1 Kopf","Zitrone":"1 Stück","Olivenöl":"2 EL"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Kartoffeln]] waschen, in Spalten schneiden, mit 1 EL [[Olivenöl]] und Salz mischen und auf dem Blech 20 Minuten vorbacken.","[[Brokkoli]] in Röschen teilen und mit dem restlichen Öl und Salz mischen.","[[Lachsfilet]] (aufgetaut) salzen, pfeffern und mit Zitronenscheiben belegen.","Lachs und Brokkoli zu den Kartoffeln aufs Blech legen und alles 12–15 Minuten backen, bis der Lachs innen gerade nicht mehr glasig ist.","Mit Zitronenspalten servieren."]},"Fischstäbchen mit Kartoffelpüree":{"q":"fish fingers mashed potatoes","a":{"Fischstäbchen":"10 Stück","Kartoffeln":"600 g","Milch":"150 ml","Butter":"30 g","Erbsen":"150 g"},"s":["[[Kartoffeln]] schälen, in gleich große Stücke schneiden und in Salzwasser 20 Minuten weich kochen.","[[Milch]] mit [[Butter]] in einem kleinen Topf erwärmen.","Kartoffeln abgießen, kurz ausdampfen lassen und mit dem Kartoffelstampfer zerdrücken. Warme Milch nach und nach unterrühren. Mit Salz und Muskat würzen.","2 EL Öl in einer Pfanne bei mittlerer Hitze erhitzen und die [[Fischstäbchen]] (gefroren) pro Seite 4 Minuten goldbraun braten.","[[Erbsen]] in wenig Salzwasser 4 Minuten garen und abgießen.","Alles zusammen servieren."]},"Thunfisch-Pasta":{"q":"tuna pasta tomato","a":{"Nudeln":"250 g","Thunfisch":"1 Dose","Passierte Tomaten":"400 g","Zwiebeln":"1 Stück","Kapern":"1 EL"},"s":["[[Nudeln]] in reichlich Salzwasser nach Packungsanweisung bissfest kochen.","[[Zwiebeln]] fein würfeln und in 1 EL Olivenöl bei mittlerer Hitze 3 Minuten dünsten.","[[Passierte Tomaten]] zugießen, mit Salz, Pfeffer und 1 TL Oregano würzen und 8 Minuten köcheln lassen.","[[Thunfisch]] abtropfen lassen, zerpflücken und mit den [[Kapern]] in die Soße geben. 2 Minuten erwärmen.","Nudeln abgießen und mit der Soße mischen.","Mit Petersilie bestreut servieren."]},"Seelachs in Kräuterkruste":{"q":"fish herb crust","a":{"Seelachsfilet":"300 g","Paniermehl":"4 EL","Petersilie":"½ Bund","Zitrone":"1 Stück","Kartoffeln":"500 g"},"s":["[[Kartoffeln]] schälen und in Salzwasser 20 Minuten weich kochen.","Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Petersilie]] fein hacken und mit [[Paniermehl]], abgeriebener Schale der [[Zitrone]], 2 EL weicher Butter oder Öl und einer Prise Salz zu einer krümeligen Masse mischen.","[[Seelachsfilet]] (aufgetaut) trocken tupfen, salzen, in eine gefettete Auflaufform legen und mit etwas Zitronensaft beträufeln.","Kräuterkruste gleichmäßig auf den Fisch drücken und 15–18 Minuten backen, bis die Kruste goldbraun ist und der Fisch sich leicht zerteilen lässt.","Mit den Kartoffeln und Zitronenspalten servieren."]},"Garnelen-Knoblauch-Pasta":{"q":"shrimp garlic pasta","a":{"Garnelen":"200 g","Spaghetti":"250 g","Knoblauch":"3 Zehen","Cherrytomaten":"200 g","Zitrone":"½ Stück"},"s":["[[Spaghetti]] in reichlich Salzwasser bissfest kochen. Eine Tasse Nudelwasser aufheben.","[[Garnelen]] auftauen, abspülen und trocken tupfen. [[Knoblauch]] in feine Scheiben schneiden, [[Cherrytomaten]] halbieren.","3 EL Olivenöl in einer großen Pfanne bei mittlerer Hitze erhitzen und den Knoblauch 1 Minute anschwitzen.","Hitze erhöhen, Garnelen zugeben und pro Seite 1–2 Minuten braten, bis sie rosa sind. Tomaten 2 Minuten mitbraten.","Spaghetti mit 4 EL Nudelwasser in die Pfanne geben, mit dem Saft der [[Zitrone]], Salz, Pfeffer und Chiliflocken abschmecken.","Mit Petersilie servieren."]},"Lachs-Reis-Bowl":{"q":"salmon poke bowl","a":{"Lachsfilet":"250 g","Reis":"150 g","Gurke":"½ Stück","Avocado":"1 Stück","Sojasoße":"3 EL"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Lachsfilet]] (aufgetaut) trocken tupfen und in 2 cm große Würfel schneiden.","1 EL Öl in einer Pfanne bei mittlerer bis hoher Hitze erhitzen und den Lachs 3–4 Minuten rundum braten.","1 EL der [[Sojasoße]] mit 1 TL Honig in die Pfanne geben und den Lachs darin glasieren.","[[Gurke]] in Scheiben, [[Avocado]] in Würfel schneiden.","Reis in Schalen geben, Lachs, Gurke und Avocado darauf anrichten und mit der restlichen Sojasoße beträufeln. Nach Wunsch mit Sesam bestreuen."]},"Fischcurry mit Kokosmilch":{"q":"fish curry coconut","a":{"Seelachsfilet":"300 g","Kokosmilch":"1 Dose","Currypaste":"1 EL","Zucchini":"1 Stück","Reis":"150 g"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Seelachsfilet]] (aufgetaut) in 3 cm große Stücke, [[Zucchini]] in Halbmonde schneiden.","1 EL Öl in einer Pfanne bei mittlerer Hitze erhitzen und die [[Currypaste]] 1 Minute anrösten.","[[Kokosmilch]] einrühren, aufkochen und die Zucchini 4 Minuten darin garen.","Fisch vorsichtig einlegen und bei kleiner Hitze 5–6 Minuten gar ziehen lassen. Nicht mehr umrühren, damit er nicht zerfällt.","Mit Salz, Sojasoße und Limettensaft abschmecken und mit Reis servieren."]},"Thunfisch-Wraps":{"q":"tuna wrap","a":{"Thunfisch":"1 Dose","Wraps":"4 Stück","Gurke":"½ Stück","Naturjoghurt":"100 g","Salat":"½ Kopf"},"s":["[[Thunfisch]] gut abtropfen lassen und mit einer Gabel zerpflücken.","Mit [[Naturjoghurt]], Salz, Pfeffer und etwas Zitronensaft verrühren.","[[Gurke]] in feine Stifte schneiden, [[Salat]] waschen und in Streifen schneiden.","[[Wraps]] in einer trockenen Pfanne pro Seite 20 Sekunden erwärmen.","Thunfischcreme, Salat und Gurke auf die Wraps geben.","Seiten einschlagen, fest einrollen und halbieren."]},"Ofen-Forelle mit Gemüse":{"q":"baked trout","a":{"Forelle":"2 Stück","Zitrone":"1 Stück","Kartoffeln":"500 g","Karotten":"2 Stück","Zucchini":"1 Stück"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Kartoffeln]] in Spalten, [[Karotten]] in Stifte schneiden. Mit 2 EL Öl und Salz auf einem Blech 15 Minuten vorbacken.","[[Forelle]] (küchenfertig) innen und außen abspülen, trocken tupfen und innen salzen und pfeffern.","Je 2 Zitronenscheiben und etwas Petersilie in den Bauch legen. Außen leicht mit Öl bestreichen.","[[Zucchini]] in Scheiben schneiden und mit den Forellen aufs Blech legen.","Alles 20–25 Minuten backen, bis sich die Rückenflosse leicht herausziehen lässt. Mit Zitrone servieren."]},"Lachs-Spinat-Lasagne":{"q":"salmon lasagna","a":{"Lachsfilet":"250 g","Lasagneplatten":"8 Stück","Spinat":"300 g","Frischkäse":"150 g","Reibekäse":"80 g"},"s":["Backofen auf 180 °C Ober-/Unterhitze (160 °C Umluft) vorheizen.","Aufgetauten [[Spinat]] gut ausdrücken. [[Lachsfilet]] (aufgetaut) in kleine Würfel schneiden.","[[Frischkäse]] mit 250 ml Milch glatt rühren und mit Salz, Pfeffer, Muskat und etwas Zitronensaft würzen.","In eine Auflaufform etwas Soße geben, dann abwechselnd [[Lasagneplatten]], Spinat, Lachs und Soße schichten. Mit Platten und Soße abschließen.","[[Reibekäse]] darüberstreuen.","35–40 Minuten backen, bis die Platten weich und die Oberfläche goldbraun ist. 5 Minuten ruhen lassen."]},"Garnelen-Reis-Pfanne":{"q":"shrimp fried rice","a":{"Garnelen":"200 g","Reis":"150 g","Erbsen":"100 g","Paprika":"1 Stück","Sojasoße":"3 EL"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen. Danach ausdampfen lassen (Reis vom Vortag ist ideal).","[[Garnelen]] auftauen und trocken tupfen. [[Paprika]] klein würfeln.","1 EL Öl in einer großen Pfanne bei hoher Hitze erhitzen und die Garnelen 2–3 Minuten braten, bis sie rosa sind. Herausnehmen.","1 EL Öl nachgeben, Paprika und [[Erbsen]] 3 Minuten braten.","Reis zugeben und 3 Minuten unter Rühren anbraten.","Garnelen und [[Sojasoße]] zugeben, gut durchschwenken und servieren."]},"Fisch-Tacos":{"q":"fish tacos","a":{"Seelachsfilet":"300 g","Wraps":"4 Stück","Rotkohl":"150 g","Naturjoghurt":"100 g","Limette":"1 Stück"},"s":["[[Rotkohl]] in sehr feine Streifen schneiden und mit Salz und dem Saft einer halben [[Limette]] verkneten. 10 Minuten ziehen lassen.","[[Naturjoghurt]] mit Salz, dem restlichen Limettensaft und einer Prise Chili verrühren.","[[Seelachsfilet]] (aufgetaut) trocken tupfen, mit Salz, 1 TL Paprikapulver und ½ TL Kreuzkümmel würzen.","2 EL Öl in einer Pfanne bei mittlerer bis hoher Hitze erhitzen und den Fisch pro Seite 3 Minuten braten. Mit einer Gabel in Stücke zerteilen.","[[Wraps]] (oder kleine Tortillas) in einer trockenen Pfanne kurz erwärmen.","Mit Rotkohl, Fisch und Limettenjoghurt füllen."]},"Gemüse-Bratreis":{"q":"fried rice egg peas","a":{"Reis":"150 g","Eier":"2 Stück","Erbsen":"100 g","Karotten":"1 Stück","Sojasoße":"3 EL"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen. Danach ausdampfen lassen (Reis vom Vortag ist ideal).","[[Karotten]] in kleine Würfel schneiden.","1 EL Öl in einer großen Pfanne bei hoher Hitze erhitzen. Karotten und [[Erbsen]] 3 Minuten braten.","Gemüse an den Rand schieben, [[Eier]] in die Mitte schlagen, verrühren und stocken lassen.","Reis zugeben und alles 3–4 Minuten unter Rühren braten.","Mit [[Sojasoße]] würzen, nach Wunsch mit Frühlingszwiebeln servieren."]},"Risotto mit Pilzen":{"q":"mushroom risotto","a":{"Risottoreis":"200 g","Champignons":"250 g","Parmesan":"40 g","Gemüsebrühe":"800 ml","Zwiebeln":"1 Stück"},"s":["[[Gemüsebrühe]] in einem Topf erhitzen und warm halten.","[[Champignons]] in Scheiben schneiden und in 1 EL Öl bei hoher Hitze 5 Minuten braun braten. Salzen und herausnehmen.","[[Zwiebeln]] fein würfeln und in 1 EL Butter bei mittlerer Hitze 3 Minuten glasig dünsten. [[Risottoreis]] zugeben und 1 Minute unter Rühren glasig werden lassen.","Eine Kelle heiße Brühe zugießen und unter Rühren einkochen lassen. So weiter verfahren, bis der Reis nach 18–20 Minuten cremig und noch leicht bissfest ist.","Pilze unterheben. Topf vom Herd nehmen, geriebenen [[Parmesan]] und 1 EL Butter einrühren.","Mit Salz und Pfeffer abschmecken, 2 Minuten ruhen lassen und servieren."]},"Tomatenrisotto":{"q":"tomato risotto","a":{"Risottoreis":"200 g","Passierte Tomaten":"300 g","Gemüsebrühe":"600 ml","Parmesan":"40 g","Zwiebeln":"1 Stück"},"s":["[[Gemüsebrühe]] mit den [[Passierte Tomaten]] in einem Topf erhitzen und warm halten.","[[Zwiebeln]] fein würfeln und in 1 EL Olivenöl bei mittlerer Hitze 3 Minuten glasig dünsten.","[[Risottoreis]] zugeben und 1 Minute unter Rühren glasig werden lassen.","Eine Kelle Tomatenbrühe zugießen und unter Rühren einkochen lassen. So weiter verfahren, bis der Reis nach 18–20 Minuten cremig und bissfest ist.","Vom Herd nehmen, geriebenen [[Parmesan]] und 1 EL Butter unterrühren.","Mit Salz, Pfeffer und Basilikum abschmecken."]},"Reis mit Ei und Gemüse":{"q":"egg fried rice","a":{"Reis":"150 g","Eier":"3 Stück","Karotten":"1 Stück","Erbsen":"100 g","Frühlingszwiebeln":"2 Stück"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen. Danach ausdampfen lassen.","[[Karotten]] fein würfeln, [[Frühlingszwiebeln]] in Ringe schneiden (helles und grünes getrennt).","1 EL Öl in einer Pfanne bei hoher Hitze erhitzen, Karotten, helle Zwiebelringe und [[Erbsen]] 3 Minuten braten.","[[Eier]] verquirlen, in die Pfanne gießen und unter Rühren fast stocken lassen.","Reis zugeben und 3 Minuten mitbraten. Mit 2 EL Sojasoße oder Salz würzen.","Mit dem Grün der Frühlingszwiebeln bestreuen."]},"Reispfanne mit Ananas":{"q":"pineapple fried rice","a":{"Reis":"150 g","Ananas":"150 g","Tofu":"200 g","Paprika":"1 Stück","Sojasoße":"3 EL"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen. Danach ausdampfen lassen.","[[Tofu]] trocken tupfen und würfeln, [[Paprika]] würfeln, [[Ananas]] in kleine Stücke schneiden.","2 EL Öl in einer Pfanne bei hoher Hitze erhitzen und den Tofu 6 Minuten knusprig braten.","Paprika zugeben und 2 Minuten braten, dann Ananas 1 Minute mitbraten.","Reis zugeben und 3 Minuten unter Rühren braten.","Mit [[Sojasoße]] und ½ TL Currypulver abschmecken."]},"Reisauflauf mit Gemüse":{"q":"rice casserole broccoli cheese","a":{"Reis":"150 g","Brokkoli":"½ Kopf","Mais":"½ Dose","Milch":"200 ml","Reibekäse":"80 g"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Brokkoli]] in kleine Röschen teilen und 3 Minuten in Salzwasser blanchieren. [[Mais]] abspülen.","Reis, Brokkoli, Mais und die Hälfte vom [[Reibekäse]] mischen und in eine gefettete Auflaufform geben.","[[Milch]] mit 1 Ei (falls vorhanden), Salz, Pfeffer und Muskat verquirlen und darübergießen.","Restlichen Käse darüberstreuen und 20 Minuten goldbraun backen."]},"Bulgur-Salat mit Kräutern":{"q":"tabbouleh","a":{"Bulgur":"120 g","Tomaten":"3 Stück","Gurke":"½ Stück","Petersilie":"1 Bund","Zitrone":"1 Stück"},"s":["[[Bulgur]] mit der 1,5-fachen Menge kochendem Salzwasser übergießen und abgedeckt 15 Minuten quellen lassen.","[[Tomaten]] und [[Gurke]] in sehr kleine Würfel schneiden.","[[Petersilie]] sehr fein hacken (sie ist die Hauptzutat, also großzügig).","Saft der [[Zitrone]] mit 3 EL Olivenöl, Salz und Pfeffer verrühren.","Bulgur auflockern und mit Gemüse, Petersilie und Dressing mischen.","Mindestens 10 Minuten ziehen lassen und nochmals abschmecken."]},"Sushi-Bowl mit Tofu":{"q":"sushi bowl","a":{"Reis":"150 g","Tofu":"200 g","Gurke":"½ Stück","Avocado":"1 Stück","Sojasoße":"3 EL","Sesam":"1 EL"},"s":["[[Reis]] (am besten Sushi- oder Milchreis) gründlich waschen, bis das Wasser klar ist. Mit 1,2-facher Menge Wasser aufkochen und zugedeckt 12 Minuten bei kleiner Hitze garen, dann 10 Minuten ruhen lassen.","Reis mit 1 EL Essig, 1 TL Zucker und ½ TL Salz würzen.","[[Tofu]] trocken tupfen, würfeln und in 1 EL Öl bei hoher Hitze 6 Minuten knusprig braten. Mit 1 EL [[Sojasoße]] ablöschen.","[[Gurke]] in dünne Scheiben, [[Avocado]] in Spalten schneiden.","Reis in Schalen geben, Tofu, Gurke und Avocado darauf anrichten.","Mit restlicher Sojasoße beträufeln und mit [[Sesam]] bestreuen."]},"Reis mit Erdnusssoße":{"q":"tofu peanut sauce rice","a":{"Reis":"150 g","Tofu":"200 g","Erdnussmus":"3 EL","Karotten":"2 Stück","Kokosmilch":"200 ml"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Tofu]] trocken tupfen und würfeln, [[Karotten]] in dünne Stifte schneiden.","1 EL Öl in einer Pfanne bei hoher Hitze erhitzen, Tofu 6 Minuten knusprig braten. Karotten 3 Minuten mitbraten.","[[Erdnussmus]] mit [[Kokosmilch]], 2 EL Sojasoße und 1 TL Honig in einem kleinen Topf glatt rühren und 2 Minuten köcheln lassen.","Mit Limettensaft und einer Prise Chili abschmecken.","Reis mit Tofu und Karotten anrichten und die Erdnusssoße darübergeben."]},"Minestrone":{"q":"minestrone","a":{"Weiße Bohnen":"1 Dose","Karotten":"2 Stück","Zucchini":"1 Stück","Passierte Tomaten":"200 g","Nudeln":"80 g","Gemüsebrühe":"800 ml"},"s":["[[Karotten]] und [[Zucchini]] in kleine Würfel schneiden. 1 Zwiebel würfeln, falls vorhanden.","1 EL Olivenöl in einem Topf bei mittlerer Hitze erhitzen und Zwiebel und Karotten 4 Minuten andünsten.","[[Gemüsebrühe]] und [[Passierte Tomaten]] zugießen und aufkochen.","[[Nudeln]] (kleine Suppennudeln) und Zucchini zugeben und 8–10 Minuten köcheln lassen.","Abgespülte [[Weiße Bohnen]] zugeben und 2 Minuten erwärmen.","Mit Salz, Pfeffer und Basilikum abschmecken, nach Wunsch mit Parmesan servieren."]},"Rote-Linsen-Suppe":{"q":"red lentil soup","a":{"Rote Linsen":"150 g","Karotten":"2 Stück","Passierte Tomaten":"200 g","Gemüsebrühe":"800 ml","Zwiebeln":"1 Stück"},"s":["[[Zwiebeln]] und [[Karotten]] fein würfeln.","1 EL Öl in einem Topf bei mittlerer Hitze erhitzen und das Gemüse 4 Minuten andünsten.","1 TL Kreuzkümmel und 1 TL Paprikapulver zugeben und 30 Sekunden anrösten.","[[Rote Linsen]] abspülen und mit [[Gemüsebrühe]] und [[Passierte Tomaten]] zugeben.","Zugedeckt 15 Minuten köcheln lassen, bis die Linsen zerfallen. Nach Wunsch fein pürieren.","Mit Salz und Zitronensaft abschmecken."]},"Erbsensuppe":{"q":"pea soup","a":{"Erbsen":"400 g","Kartoffeln":"200 g","Zwiebeln":"1 Stück","Gemüsebrühe":"600 ml","Frischkäse":"50 g"},"s":["[[Zwiebeln]] fein würfeln, [[Kartoffeln]] schälen und klein würfeln.","1 EL Butter in einem Topf bei mittlerer Hitze schmelzen und die Zwiebeln 3 Minuten dünsten.","Kartoffeln und [[Gemüsebrühe]] zugeben und 12 Minuten köcheln lassen.","Tiefgekühlte [[Erbsen]] zugeben und 5 Minuten mitkochen.","[[Frischkäse]] zugeben und alles fein pürieren.","Mit Salz, Pfeffer und etwas Minze oder Petersilie abschmecken."]},"Tomatensuppe mit Mozzarella":{"q":"tomato soup","a":{"Passierte Tomaten":"500 g","Tomaten":"3 Stück","Zwiebeln":"1 Stück","Knoblauch":"1 Zehe","Mozzarella":"125 g"},"s":["[[Zwiebeln]] und [[Knoblauch]] fein würfeln, [[Tomaten]] grob würfeln.","2 EL Olivenöl in einem Topf bei mittlerer Hitze erhitzen und Zwiebeln und Knoblauch 3 Minuten dünsten.","Tomaten zugeben und 5 Minuten schmoren.","[[Passierte Tomaten]] und 200 ml Wasser zugeben, mit Salz, Pfeffer und einer Prise Zucker würzen und 10 Minuten köcheln lassen.","Suppe fein pürieren.","[[Mozzarella]] in Würfel schneiden, in Teller verteilen und die heiße Suppe darübergießen. Mit Basilikum servieren."]},"Kürbissuppe mit Kokos":{"q":"pumpkin soup","a":{"Hokkaido":"600 g","Kokosmilch":"200 ml","Karotten":"1 Stück","Gemüsebrühe":"600 ml","Ingwer":"15 g"},"s":["[[Hokkaido]] waschen, halbieren, entkernen und mit Schale in Würfel schneiden. [[Karotten]] schälen und klein schneiden. [[Ingwer]] schälen und fein hacken.","1 EL Öl in einem Topf bei mittlerer Hitze erhitzen und Ingwer 1 Minute anschwitzen.","Kürbis und Karotten zugeben, 2 Minuten mitdünsten und mit [[Gemüsebrühe]] ablöschen.","Zugedeckt 20 Minuten köcheln lassen, bis der Kürbis weich ist.","[[Kokosmilch]] zugeben und alles fein pürieren.","Mit Salz, Pfeffer, einer Prise Curry und Limettensaft abschmecken."]},"Flammkuchen mit Zwiebeln":{"q":"Flammkuchen","a":{"Flammkuchenteig":"1 Rolle","Crème fraîche":"150 g","Rote Zwiebeln":"1 Stück","Speckwürfel":"100 g","Frühlingszwiebeln":"2 Stück"},"s":["Backofen auf 240 °C Ober-/Unterhitze (220 °C Umluft) vorheizen. Ein Blech im Ofen mit aufheizen, wenn möglich.","[[Flammkuchenteig]] mit dem Backpapier ausrollen.","[[Crème fraîche]] mit Salz, Pfeffer und Muskat verrühren und dünn auf dem Teig verstreichen, dabei 1 cm Rand lassen.","[[Rote Zwiebeln]] in feine Ringe schneiden und mit den [[Speckwürfel]] darauf verteilen.","Auf der untersten Schiene 10–12 Minuten backen, bis der Rand knusprig und braun ist.","Mit Ringen der [[Frühlingszwiebeln]] bestreuen und in Stücke schneiden."]},"Pizza Margherita":{"q":"pizza margherita","a":{"Pizzateig":"1 Rolle","Passierte Tomaten":"150 g","Mozzarella":"125 g","Basilikum":"½ Bund","Olivenöl":"1 EL"},"s":["Backofen auf 240 °C Ober-/Unterhitze (220 °C Umluft) vorheizen. (oder die höchste Stufe).","[[Passierte Tomaten]] mit Salz, 1 TL Oregano und [[Olivenöl]] verrühren.","[[Pizzateig]] mit dem Backpapier auf ein Blech legen und die Tomatensoße dünn darauf verstreichen, dabei einen Rand lassen.","[[Mozzarella]] gut abtropfen lassen, in kleine Stücke zupfen und verteilen.","Auf der untersten Schiene 12–15 Minuten backen, bis der Rand goldbraun ist und der Käse Blasen wirft.","Mit frischem [[Basilikum]] belegen und sofort servieren."]},"Pizza mit Gemüse":{"q":"vegetable pizza","a":{"Pizzateig":"1 Rolle","Passierte Tomaten":"150 g","Paprika":"1 Stück","Champignons":"100 g","Reibekäse":"100 g"},"s":["Backofen auf 240 °C Ober-/Unterhitze (220 °C Umluft) vorheizen. (oder die höchste Stufe).","[[Passierte Tomaten]] mit Salz, 1 TL Oregano und 1 EL Olivenöl verrühren.","[[Paprika]] in dünne Streifen, [[Champignons]] in dünne Scheiben schneiden.","[[Pizzateig]] auf einem Blech mit Soße bestreichen, Gemüse darauf verteilen und mit [[Reibekäse]] bestreuen.","Auf der untersten Schiene 12–15 Minuten backen, bis der Rand knusprig ist.","In Stücke schneiden und servieren."]},"Ofen-Nachos mit Bohnen":{"q":"nachos cheese beans","a":{"Tortillachips":"150 g","Kidneybohnen":"½ Dose","Mais":"½ Dose","Reibekäse":"100 g","Naturjoghurt":"100 g"},"s":["Backofen auf 200 °C Ober-/Unterhitze (180 °C Umluft) vorheizen.","[[Kidneybohnen]] und [[Mais]] abspülen und gut abtropfen lassen.","[[Tortillachips]] in einer Auflaufform oder auf einem Blech mit Backpapier verteilen.","Bohnen und Mais darüberstreuen und mit [[Reibekäse]] bedecken.","8–10 Minuten backen, bis der Käse geschmolzen ist.","[[Naturjoghurt]] mit Salz und Limettensaft verrühren und dazu servieren, nach Wunsch mit Salsa und Jalapeños."]},"Griechischer Salat mit Brot":{"q":"greek salad","a":{"Tomaten":"3 Stück","Gurke":"1 Stück","Feta":"200 g","Oliven":"60 g","Rote Zwiebeln":"1 Stück","Baguette":"½ Stück"},"s":["[[Tomaten]] in Spalten schneiden, [[Gurke]] in dicke Halbmonde.","[[Rote Zwiebeln]] in dünne Ringe schneiden.","Gemüse mit den [[Oliven]] in einer Schüssel mischen.","3 EL Olivenöl mit 1 EL Rotweinessig, Salz, Pfeffer und 1 TL Oregano verrühren und darübergeben.","[[Feta]] als Block oder in Würfeln obenauf legen und mit etwas Oregano bestreuen.","Mit aufgeschnittenem [[Baguette]] servieren."]},"Caesar-Salat mit Hähnchen":{"q":"caesar salad chicken","a":{"Hähnchenbrust":"250 g","Salat":"1 Kopf","Parmesan":"30 g","Naturjoghurt":"100 g","Croutons":"40 g","Zitrone":"½ Stück"},"s":["[[Hähnchenbrust]] mit Salz und Pfeffer würzen und in 1 EL Öl bei mittlerer bis hoher Hitze pro Seite 5–6 Minuten braten, bis es durch ist. 3 Minuten ruhen lassen und in Streifen schneiden.","Für das Dressing [[Naturjoghurt]] mit dem Saft der [[Zitrone]], 1 TL Senf, 1 EL Olivenöl, der Hälfte vom fein geriebenen [[Parmesan]], Salz und Pfeffer verrühren.","[[Salat]] (am besten Römersalat) waschen und in mundgerechte Stücke zupfen.","Salat mit dem Dressing mischen.","Hähnchen und [[Croutons]] darauf verteilen.","Mit dem restlichen Parmesan bestreuen."]},"Gebackener Blumenkohl":{"q":"roasted cauliflower","a":{"Blumenkohl":"1 Kopf","Naturjoghurt":"150 g","Olivenöl":"3 EL","Knoblauch":"1 Zehe","Zitrone":"½ Stück"},"s":["Backofen auf 220 °C Ober-/Unterhitze (200 °C Umluft) vorheizen.","[[Blumenkohl]] in große Röschen teilen (oder in 2 cm dicke Scheiben schneiden).","Mit [[Olivenöl]], Salz, 1 TL Kreuzkümmel und 1 TL Paprikapulver mischen.","Auf einem Blech mit Backpapier 25–30 Minuten backen, nach der Hälfte wenden, bis die Ränder gut gebräunt sind.","[[Naturjoghurt]] mit fein geriebenem [[Knoblauch]], dem Saft der [[Zitrone]] und Salz verrühren.","Blumenkohl mit dem Joghurt servieren, nach Wunsch mit Petersilie."]},"Couscous mit Ofengemüse":{"q":"couscous roasted vegetables","a":{"Couscous":"150 g","Aubergine":"1 Stück","Zucchini":"1 Stück","Paprika":"1 Stück","Olivenöl":"3 EL","Feta":"100 g"},"s":["Backofen auf 220 °C Ober-/Unterhitze (200 °C Umluft) vorheizen.","[[Aubergine]], [[Zucchini]] und [[Paprika]] in 2 cm große Stücke schneiden.","Gemüse mit [[Olivenöl]], Salz, Pfeffer und 1 TL Kreuzkümmel auf einem Blech mischen und 25 Minuten backen, nach der Hälfte wenden.","[[Couscous]] mit der gleichen Menge kochendem Salzwasser übergießen und abgedeckt 5 Minuten quellen lassen. Mit einer Gabel auflockern.","Ofengemüse unter den Couscous mischen und mit Zitronensaft abschmecken.","[[Feta]] darüberbröseln."]},"Linsen-Bolognese":{"q":"lentil bolognese","a":{"Rote Linsen":"100 g","Nudeln":"250 g","Passierte Tomaten":"500 g","Karotten":"1 Stück","Zwiebeln":"1 Stück"},"s":["[[Zwiebeln]] und [[Karotten]] sehr fein würfeln.","1 EL Olivenöl in einem Topf bei mittlerer Hitze erhitzen und das Gemüse 5 Minuten dünsten. 1 EL Tomatenmark kurz mitrösten, falls vorhanden.","[[Rote Linsen]] abspülen und mit [[Passierte Tomaten]] und 250 ml Wasser zugeben.","Mit Salz, Pfeffer, 1 TL Oregano und einer Prise Zucker würzen und 15 Minuten köcheln lassen, bis die Linsen weich sind.","Inzwischen [[Nudeln]] in reichlich Salzwasser bissfest kochen.","Nudeln mit der Linsen-Bolognese servieren."]},"Tofu-Satay mit Reis":{"q":"tofu satay","a":{"Tofu":"200 g","Erdnussmus":"3 EL","Reis":"150 g","Kokosmilch":"200 ml","Limette":"1 Stück"},"s":["[[Reis]] abspülen, mit der doppelten Menge Salzwasser aufkochen und zugedeckt bei kleiner Hitze 15 Minuten garen.","[[Tofu]] trocken tupfen, in 2 cm große Würfel schneiden und mit 1 EL Sojasoße und ½ TL Currypulver mischen.","1 EL Öl in einer Pfanne bei hoher Hitze erhitzen und den Tofu 6–8 Minuten rundum knusprig braten.","[[Erdnussmus]], [[Kokosmilch]], 1 EL Sojasoße und 1 TL Honig in einem kleinen Topf glatt rühren und 2 Minuten köcheln lassen.","Mit dem Saft der [[Limette]] und einer Prise Chili abschmecken.","Tofu (nach Wunsch auf Spieße gesteckt) mit Reis und Satay-Soße servieren."]},"Overnight Oats mit Beeren":{"q":"overnight oats","a":{"Haferflocken":"100 g","Milch":"200 ml","Naturjoghurt":"150 g","Beeren":"150 g","Honig":"2 TL"},"s":["Am Vorabend [[Haferflocken]], [[Milch]] und [[Naturjoghurt]] in einer Schüssel verrühren.","Mit [[Honig]] und einer Prise Salz süßen und auf 2 Gläser mit Deckel verteilen.","Verschlossen über Nacht (mindestens 6 Stunden) in den Kühlschrank stellen.","[[Beeren]] (tiefgekühlt) ebenfalls am Vorabend in einer Schale im Kühlschrank auftauen lassen.","Morgens die Oats umrühren. Sind sie zu fest, einen Schuss Milch zugeben.","Beeren samt Saft darauf verteilen und servieren."]},"Rührei mit Vollkornbrot":{"q":"scrambled eggs bread","a":{"Eier":"4 Stück","Milch":"3 EL","Butter":"1 EL","Vollkornbrot":"4 Scheiben","Schnittlauch":"½ Bund"},"s":["[[Eier]] mit [[Milch]], einer Prise Salz und Pfeffer in einer Schüssel kräftig verquirlen.","[[Schnittlauch]] in feine Röllchen schneiden.","[[Butter]] in einer beschichteten Pfanne bei mittlerer bis kleiner Hitze schmelzen, sie soll nicht braun werden.","Eiermasse hineingießen und 20 Sekunden stehen lassen. Dann mit einem Pfannenwender langsam vom Rand zur Mitte schieben.","Nach 2–3 Minuten von der Herdplatte nehmen, solange das Rührei noch leicht feucht glänzt – es gart nach.","Mit Schnittlauch bestreuen und mit [[Vollkornbrot]] servieren."]},"Apfel-Zimt-Porridge":{"q":"porridge apple cinnamon","a":{"Haferflocken":"100 g","Milch":"400 ml","Äpfel":"1 Stück","Zimt":"½ TL","Honig":"2 TL"},"s":["[[Haferflocken]] mit [[Milch]] und einer Prise Salz in einem Topf unter Rühren aufkochen.","Hitze auf
