// Onlinepreis-Integration: Open Prices ist eine öffentliche Belegdatenbank (keine Live-Preisliste der Händler).
// Preise werden nur nach ausdrücklicher Auswahl des Nutzers in die private Einkaufsliste übernommen.
function parseQuantity(value){
 const s=String(value||'').toLowerCase().replace(/,/g,'.').replace(/stück|stk\.?/g,'st').trim();
 const match=s.match(/^(?:(\d+(?:\.\d+)?)\s*[x×]\s*)?(\d+(?:\.\d+)?)\s*(kg|g|ml|l|st|dose[n]?|packung[en]?)\b/i);
 if(!match)return null;
 let num=Number(match[1]||1)*Number(match[2]),unit=match[3];
 if(unit==='kg'){num*=1000;unit='g'}if(unit==='l'){num*=1000;unit='ml'}
 if(unit.startsWith('dose'))unit='dose';if(unit.startsWith('pack'))unit='packung';
 return {n:num,unit};
}
function packageCount(item){
 const p=state.priceOverrides?.[item.ing];if(!p)return null;
 const required=parseQuantity(item.qty),available=parseQuantity(p.qty);
 if(required&&available&&required.unit===available.unit&&available.n>0){return Math.max(1,Math.ceil(required.n*item.times*state.persons/3/available.n))}
 return Math.max(1,Math.ceil(item.times*state.persons/3));
}
function itemCost(item){if(item.custom)return Number(item.price)||0;const p=state.priceOverrides?.[item.ing];return p&&Number.isFinite(+p.amount)&&+p.amount>0?Number(p.amount)*packageCount(item):item.price*item.times*state.persons/3}

const observedPrices={};
async function lookupPrice(ing){
 const title=priceTitle(ing);openPriceDialog(title+'<div class="price-spinner">⏳ Suche gemeldete Preise online …</div>');
 const body=$('price-dialog-body');
 // Nutzergetriggerte Abfrage, kein automatisches Crawling oder unbelegter Echtzeitpreis.
 try{
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),14000);
  let response;
  try{response=await fetch('https://prices.openfoodfacts.org/api/v1/prices?'+new URLSearchParams({product_name:ing,currency:'EUR',order_by:'-date',size:'65'}),{signal:controller.signal,headers:{Accept:'application/json'}})}finally{clearTimeout(timer)}
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();if(!Array.isArray(data.items))throw new Error('Ungültige Antwort');
  let list=data.items.filter(p=>p&&Number(p.price)>0&&p.currency==='EUR');
  const info=p=>(p.location?.osm_display_name||p.location?.name||p.location?.address||'')+' '+(p.location?.osm_address_country_code||'');
  const german=p=>/\bDeutschland\b|\bGermany\b|\bDE\b/i.test(info(p));
  const chosen=String(state.store||'').replace(/edeka/i,'Edeka').toLowerCase();
  list.sort((a,b)=>(german(b)?3:0)-(german(a)?3:0)+ (info(b).toLowerCase().includes(chosen)?2:0)-(info(a).toLowerCase().includes(chosen)?2:0) || String(b.date).localeCompare(String(a.date)) );
  observedPrices[ing]=list.slice(0,18);
  body.innerHTML=title+'<div class="price-info">📅 Das sind <b>historische, gemeldete Preise</b>, keine Live-Angebote. Händler und Datum prüfen; der Preis wird erst nach deiner Auswahl übernommen.</div>'+(observedPrices[ing].length?observedPrices[ing].map((p,k)=>{
   const name=p.product?.product_name||p.product_name||ing;
   const location=p.location?.osm_display_name||p.location?.name||'Markt nicht angegeben';
   const quantity=p.product?.quantity|| (p.price_per==='KILOGRAM'?'1 kg':p.price_per==='LITER'?'1 l':'Packungsgröße unbekannt');
   const badge=german(p)?'🇩🇪':'🌍';
   return '<div class="price-card"><b>'+money(p.price)+'</b> · '+escapeHtml(String(quantity))+'<div class="subline">'+escapeHtml(name)+'<br>'+badge+' '+escapeHtml(location)+'<br>📅 '+escapeHtml(p.date||'Datum unbekannt')+'</div><button onclick="useObservedPrice(decodeURIComponent(\''+encodeURIComponent(ing)+'\'),'+k+')">Preis übernehmen</button></div>'
  }).join(''):'<p class="price-hint">Für diesen Suchbegriff wurden keine Preismeldungen gefunden. Die App zeigt weiterhin den Schätzpreis an.</p>')+manualPriceForm(ing)+offerLinks();
 }catch(e){if(!document.getElementById('price-dialog-body'))return;body.innerHTML=title+'<div class="price-info">⚠️ Preisabfrage nicht erreichbar oder keine Verbindung. Grund: '+escapeHtml(e.name==='AbortError'?'Zeitüberschreitung':e.message)+'. Der Schätzpreis bleibt unverändert.</div>'+manualPriceForm(ing)+offerLinks()}
}
function manualPriceForm(ing){let p=state.priceOverrides?.[ing];return '<div class="section"><h3>✏ Eigenen Preis eintragen</h3><p class="price-hint">Gesamtpreis für eine Packung, unabhängig von der Schätzpreis-Angabe.</p><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input class="price-input" type="number" min="0.01" max="1000" step="0.01" id="manual-price" placeholder="Preis in €" value="'+(p?.amount||'')+'"><input class="price-input" id="manual-quantity" placeholder="z.B. 500 g" value="'+escapeHtml(p?.qty||ITEMS[ing]?.[0]||'')+'"><button class="secondary" onclick="saveManualPrice(decodeURIComponent(\''+encodeURIComponent(ing)+'\'))">Speichern</button></div>'+(p?'<p><button class="secondary" onclick="deletePrice(decodeURIComponent(\''+encodeURIComponent(ing)+'\'))">Gespeicherten Preis löschen</button></p>':'')+'</div>'}
